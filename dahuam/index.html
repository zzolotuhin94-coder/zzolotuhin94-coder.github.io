<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAHUAM.202 Küche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#173229">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=PT+Sans:wght@400;700&family=Saira+Condensed:wght@300;400&family=Roboto+Condensed:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Schibsted+Grotesk:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell. Pine sidebar (desktop) / bottom tab bar (phone); content = summary first, then cards and dense tables.
   Accent = Marille (apricot), a nod to the Wachau and to the Marillenknödel on the card. */
:root{
  --bg:#f2f4f0; --surface:#ffffff; --surface-2:#eceee9; --fg:#14201b; --muted:#5c6963; --line:#dde2db;
  --side:#173229; --side-2:#21443a; --side-fg:#eef4f0; --side-muted:#9fb8ad;
  --accent:#ec7a2f; --accent-2:#ffd9bd; --accent-soft:#fdeee2; --accent-fg:#ffffff;
  --good:#23845a; --good-bg:#dff1e7; --warn:#a46a00; --warn-bg:#faedcc; --bad:#c2402f; --bad-bg:#fbe3de;
  --s1:#ec7a2f; --s2:#2f7d63; --s3:#d9a632; --s4:#5677b8; --s5:#b4557c; --s6:#7d6bb0; --s7:#cfd5cd;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 8px 24px -12px rgba(20,32,27,.18);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-s:10px;
  --ph-s:42%; --ph-l1:88%; --ph-l2:76%; --ph-ink:30%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1311; --surface:#151d1a; --surface-2:#1c2622; --fg:#e8eee9; --muted:#93a29b; --line:#26322d;
  --side:#0a100e; --side-2:#16211d; --side-fg:#e8eee9; --side-muted:#7f948b;
  --accent:#ff8c42; --accent-2:#5a3218; --accent-soft:#2a1c12; --accent-fg:#1a0d04;
  --good:#5fd39a; --good-bg:#15301f; --warn:#f0c255; --warn-bg:#332810; --bad:#ff8b7a; --bad-bg:#3a1a15;
  --s1:#ff8c42; --s2:#4fb38f; --s3:#e8bb4a; --s4:#7d9be0; --s5:#e07aa4; --s6:#a08fe0; --s7:#33403a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --ph-s:30%; --ph-l1:24%; --ph-l2:17%; --ph-ink:75%;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#151d1a; --surface-2:#1c2622; --fg:#e8eee9; --muted:#93a29b; --line:#26322d;
  --side:#0a100e; --side-2:#16211d; --side-fg:#e8eee9; --side-muted:#7f948b;
  --accent:#ff8c42; --accent-2:#5a3218; --accent-soft:#2a1c12; --accent-fg:#1a0d04;
  --good:#5fd39a; --good-bg:#15301f; --warn:#f0c255; --warn-bg:#332810; --bad:#ff8b7a; --bad-bg:#3a1a15;
  --s1:#ff8c42; --s2:#4fb38f; --s3:#e8bb4a; --s4:#7d9be0; --s5:#e07aa4; --s6:#a08fe0; --s7:#33403a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --ph-s:30%; --ph-l1:24%; --ph-l2:17%; --ph-ink:75%;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
button{font:inherit;color:inherit}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.flip{transform:rotate(180deg)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .sm{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:22px;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:800 15px/1 var(--f-display);letter-spacing:-.03em}
.brand b{display:block;font:800 18px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font-size:12px;color:var(--side-muted);margin-top:4px}
.side .nav-slot{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--side-muted);padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav-i:hover{background:var(--side-2);color:var(--side-fg)}
.nav-i.on{background:var(--side-2);color:var(--side-fg)}
.nav-i.on .ico{color:var(--accent)}
.kbd-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--side-2);background:transparent;color:var(--side-muted);border-radius:12px;padding:9px 12px;cursor:pointer;width:100%}
.kbd-btn:hover{color:var(--side-fg);border-color:var(--side-muted)}
.kbd-btn kbd{margin-left:auto;font:500 11px var(--f-mono);border:1px solid var(--side-2);border-radius:6px;padding:2px 6px}
.side-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12px;color:var(--side-muted)}
.theme-btn{border:0;background:var(--side-2);color:var(--side-fg);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.topbar,.bottom{display:none}

main{padding-block:28px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}
main.enter{animation:rise .28s ease-out}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .shell{display:block}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;background:var(--side);color:var(--side-fg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand{padding:0;flex:1}
  .topbar .logo{width:34px;height:34px;border-radius:10px;font-size:13px}
  .topbar .brand b{font-size:16px}
  .bottom{display:flex;position:fixed;inset:auto 0 0 0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottom .nav-slot{display:flex;width:100%}
  .bottom .nav-i{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;color:var(--muted);text-align:center;align-items:center;min-width:0}
  .bottom .nav-i span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bottom .nav-i:hover{background:transparent;color:var(--fg)}
  .bottom .nav-i.on{background:transparent;color:var(--fg)}
  main{padding-block:18px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* Typo */
h1{font:800 clamp(28px,4vw,40px)/1.05 var(--f-display);letter-spacing:-.03em;margin:0;text-wrap:balance}
h2{font:700 15px/1.3 var(--f-body);margin:0;letter-spacing:-.005em}
.eyebrow{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:8px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sec-h{display:flex;align-items:center;gap:10px;font:700 20px/1.2 var(--f-display);letter-spacing:-.02em;margin:30px 0 12px}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--fg);background:var(--accent-soft);border:1px solid var(--accent-2);border-radius:12px;padding:10px 14px;margin:0 0 20px}
.note .ico{color:var(--accent);margin-top:1px}

/* Controls */
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--muted) 50%,var(--line))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:160px;resize:vertical;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;border-radius:12px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);transition:transform .1s,border-color .15s,background .15s}
.btn .ico{width:18px;height:18px}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 6px 18px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.icon-btn{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.lg{width:42px;height:42px;border:1px solid var(--line);background:var(--surface)}
.icon-btn.danger:hover{color:var(--bad)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-family:var(--f-mono);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search input{border:0;background:transparent;padding:10px 0;flex:1;box-shadow:none!important}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button small{font:500 11px var(--f-mono);opacity:.7}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 4px;scrollbar-width:thin}
.chips-row .sep{flex:none;width:1px;background:var(--line);margin:4px 4px}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.chip small{font:500 11px var(--f-mono);color:var(--muted)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.on small{color:inherit;opacity:.7}
.dot{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 60% 52%);flex:none}

/* Panels & tiles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel.flush{padding:0;overflow:hidden}
.panel.accent{border-color:var(--accent-2);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-h.pad{padding:16px 18px 0;margin-bottom:12px}
.panel-f{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.panel-f .hint{margin:0}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.tile{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);text-align:left;min-width:0}
.tile > div{min-width:0;flex:1}
.tile.click{cursor:pointer;transition:transform .15s,border-color .15s}
.tile.click:hover{transform:translateY(-2px);border-color:var(--accent)}
.t-v{font:700 30px/1 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t-v small{font-size:16px;color:var(--muted);font-weight:500}
.t-l{font-weight:600;margin-top:6px}
.t-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.tile-ring{position:relative;display:grid;place-items:center;flex:none}
.tile-ring b{position:absolute;font:700 14px var(--f-mono)}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.tiles{gap:10px}.tile{padding:14px;gap:12px}.t-v{font-size:24px}}

.ring .trk{stroke:var(--surface-2)}
.ring .val{transition:stroke-dasharray .5s cubic-bezier(.2,.8,.2,1)}
.ring.good .val{stroke:var(--good)} .ring.warn .val{stroke:var(--warn)} .ring.bad .val{stroke:var(--bad)} .ring.na .val{stroke:transparent}

.dash-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1100px){.dash-grid{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend .tl{width:14px;height:0;border-top:2px dashed var(--fg);opacity:.6}
.bars{position:relative;display:flex;flex-direction:column;gap:4px}
.bar-r{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 56px;align-items:center;gap:12px;border:0;background:transparent;padding:6px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;text-align:left}
.bar-r:hover{background:var(--surface-2)}
.bar-n{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t{position:relative;height:12px;background:var(--surface-2);border-radius:99px}
.bar-t i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar-t i.good{background:var(--good)} .bar-t i.warn{background:var(--warn)} .bar-t i.bad{background:var(--bad)}
.bar-t::after{content:"";position:absolute;left:var(--tg);top:-4px;bottom:-4px;border-left:2px dashed var(--fg);opacity:.5}
.bar-v{font:600 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.bar-axis{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 56px;gap:12px;font:500 11px var(--f-mono);color:var(--muted);padding-top:4px}
.bar-axis{margin:0 -8px;padding-inline:8px}
.bar-axis .ax{display:flex;justify-content:space-between}
.bar-axis i{font-style:normal}
@media (max-width:560px){.bar-r,.bar-axis{grid-template-columns:minmax(0,110px) minmax(0,1fr) 48px;gap:8px}}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface-2)}
.stackbar i{display:block;height:100%;min-width:3px}
.leg{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.leg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.leg .sw{width:12px;height:12px;border-radius:4px}
.leg .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.todo button:hover{border-color:var(--accent);transform:translateX(2px)}
.todo b{font:700 16px var(--f-mono);min-width:28px}
.todo span{flex:1;min-width:0}
.todo .ico{color:var(--muted);width:16px;height:16px}

/* Dish cards */
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.dish{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s;min-width:0}
.dish:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.dish.nocard{background:transparent;border-style:dashed;box-shadow:none}
.dish-main{display:flex;flex-direction:column;gap:6px;width:100%;height:100%;border:0;background:transparent;text-align:left;padding:16px 16px 14px;cursor:pointer;border-radius:inherit}
.dish-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-right:28px}
.dish-n{font:700 16.5px/1.25 var(--f-display);letter-spacing:-.01em}
.price{font:700 15px var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.dish-d{font-size:13px;color:var(--muted);line-height:1.4}
.dish-b{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.dish .edit{position:absolute;top:10px;right:8px;opacity:.55}
.dish:hover .edit{opacity:1}
.fcw{display:flex;align-items:center;gap:10px}
.fcw span{display:flex;flex-direction:column;line-height:1.15}
.fcw b{font-size:14px}
.fcw small{font-size:12px;color:var(--muted)}
.fcw.sm b{font-size:12.5px}
.add{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--accent)}
.add .ico{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.alg{font:700 10.5px/1 var(--f-mono);padding:4px 5px;border-radius:6px;background:var(--surface-2);color:var(--muted)}

/* Recipe cards */
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.rc{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,border-color .18s;min-width:0}
.rc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:600 11.5px/1 var(--f-body);padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.semi{background:var(--warn-bg);color:var(--warn)}
.tag.dish{background:var(--good-bg);color:var(--good)}
.rc-n{font:700 17px/1.25 var(--f-display);letter-spacing:-.01em}
.rc-m{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.rc-b{display:flex;gap:22px;padding-top:6px;border-top:1px solid var(--line);margin-top:2px}
.rc-b span{display:flex;flex-direction:column;padding-top:8px}
.rc-b b{font-size:16px}
.rc-b small{font-size:12px;color:var(--muted)}

/* Recipe detail */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;padding:0;margin-bottom:14px}
.back:hover{color:var(--fg)}
.back .ico{width:16px;height:16px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.hero > *{position:relative}
.title-in{display:block;font:800 clamp(24px,3.4vw,36px)/1.1 var(--f-display);letter-spacing:-.03em;border:1px solid transparent;background:transparent;padding:2px 8px;margin:0 -9px;width:calc(100% + 18px);min-height:0;resize:none;overflow:hidden;text-wrap:balance}
.title-in:hover{border-color:var(--line)}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px 30px;margin-top:14px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:20px}
.hero-stats small{font-size:12.5px;color:var(--muted)}
.hero-ring{position:relative;display:grid;place-items:center}
.hero-ring span{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-ring b{font-size:20px}
.hero-ring small{font-size:10.5px;color:var(--muted);max-width:80px;line-height:1.2}
.hero-acts{display:flex;flex-direction:column;gap:8px;align-self:start}
@media (max-width:700px){.hero{grid-template-columns:minmax(0,1fr) auto;padding:18px;gap:16px}.hero-acts{grid-column:1/-1;flex-direction:row;justify-content:flex-end}.hero-ring svg{width:92px;height:92px}}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{font-size:15px;font-weight:400}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;vertical-align:middle}
td{border-top:1px solid var(--line)}
th{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;background:var(--surface-2)}
th:first-child,td:first-child{padding-left:18px} th:last-child,td:last-child{padding-right:12px}
.r{text-align:right}
tfoot td{font-weight:700;background:var(--surface-2)}
table.edit{min-width:700px}
table.edit select{width:100%;min-width:220px}
table.edit input[type=number]{width:84px;text-align:right;padding:7px 8px}
table.edit tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
td.r.mono{position:relative;white-space:nowrap}
.share{position:absolute;right:10px;bottom:3px;height:3px;border-radius:99px;background:var(--accent);opacity:.7;max-width:calc(100% - 20px)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty em{font-style:normal;font-size:12.5px;color:var(--muted);min-width:22px;text-align:left}
.sim-price{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sim-price b{font-size:30px;font-weight:700}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:12px 0;box-shadow:none!important}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--warn) 35%,var(--good) 70%)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--warn) 35%,var(--good) 70%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--fg);margin-top:-8px;cursor:grab;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--fg);cursor:grab}
.range-l{display:flex;justify-content:space-between;font:500 11.5px var(--f-mono);color:var(--muted);margin-top:-4px}
.sim-out{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-top:14px}
.sim-out .kv{flex:1;min-width:170px;margin:0}
.big2{font-size:22px!important}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:10px}
.kv span:nth-child(even){font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.portions{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.portions input{width:76px;padding:6px 8px;text-align:right}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:300px;overflow:auto}
.plist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.plist li span{min-width:0}
.plist b{white-space:nowrap}
.alg-big{display:flex;flex-wrap:wrap;gap:6px}
.alg-big span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13.5px}
.alg-big b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px var(--f-mono)}

/* Products */
table.prods{min-width:820px}
table.prods input[type=number]{width:86px;text-align:right;padding:7px 8px}
table.prods tbody tr{transition:background .15s}
table.prods tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.pn{display:block;font-weight:600}
.cnt{display:inline-grid;place-items:center;min-width:28px;height:24px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font:700 12px var(--f-mono);padding:0 6px}
.cnt.zero{background:var(--surface-2);color:var(--muted)}

/* Dialog, Palette, Toast */
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog[open]{animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(8,14,12,.5);backdrop-filter:blur(3px)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg-h{display:flex;justify-content:space-between;align-items:center}
dialog h3{margin:0;font:800 22px var(--f-display);letter-spacing:-.02em}
.dlg-p{margin:0}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.dlg-actions .sp{flex:1}
.algs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.algc{position:relative;cursor:pointer}
.algc input{position:absolute;opacity:0;pointer-events:none}
.algc span{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;transition:background .15s,border-color .15s}
.algc b{font-family:var(--f-mono)}
.algc input:checked + span{background:var(--accent-soft);border-color:var(--accent)}
.algc input:focus-visible + span{outline:2px solid var(--accent)}
textarea.code{min-height:200px;font:12px/1.4 var(--f-mono)}
#pal{position:fixed;inset:0;z-index:50;background:rgba(8,14,12,.5);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:max(10vh,calc(env(safe-area-inset-top,0px) + 16px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.pal-box{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden;animation:pop .18s ease-out}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-in input{flex:1;border:0;background:transparent;font-size:17px;padding:4px 0;box-shadow:none!important}
.pal-in kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#palList{list-style:none;margin:0;padding:6px;max-height:min(420px,60vh);overflow:auto}
#palList button{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer}
#palList button.sel,#palList button:hover{background:var(--surface-2)}
.pg{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
#palList .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
@media (max-width:560px){#palList button{grid-template-columns:minmax(0,1fr)}.ps,.pg{display:none}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* Fotos */
.ph{display:block;width:100%;height:100%;object-fit:cover}
.ph-empty{display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) var(--ph-s) var(--ph-l1)),hsl(calc(var(--h) + 30) var(--ph-s) var(--ph-l2)))}
.ph-empty b{font:800 44px/1 var(--f-display);color:hsl(var(--h) 35% var(--ph-ink));opacity:.55;letter-spacing:-.04em}
.ph.xs{width:40px;height:40px;border-radius:10px;flex:none}
.ph-empty.xs b{font-size:17px}
.ph-btn{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px;background:rgba(10,18,15,.62);color:#fff;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .15s,transform .15s}
.ph-btn:hover{background:rgba(10,18,15,.85);transform:scale(1.05)}
.ph-btn .ico{width:18px;height:18px}
.ph-btn.big{padding:9px 14px;font-weight:600;font-size:13px}
.ph-btn.del{right:auto;left:10px}
.vb{display:inline-flex;align-items:center;font:700 10.5px/1 var(--f-mono);padding:4px 6px;border-radius:6px;background:var(--good-bg);color:var(--good)}
.vb.vg{background:var(--good);color:var(--surface)}
.vb.top{background:var(--accent);color:var(--accent-fg)}
.vb.off{background:var(--surface-2);color:var(--muted);font-family:var(--f-body);font-weight:600}
.vb.warn{background:var(--warn-bg);color:var(--warn);font-family:var(--f-body);font-weight:600;margin-left:6px}
.dish{display:flex;flex-direction:column;overflow:hidden}
.dish-ph{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--surface-2);overflow:hidden}
.dish-ph .ph-btn{top:8px;bottom:auto;right:48px;width:34px;height:34px;padding:0;justify-content:center;opacity:0}
.dish:hover .dish-ph .ph-btn,.dish-ph .ph-btn:focus-visible{opacity:1}
@media (hover:none){.dish-ph .ph-btn{opacity:1}}
.ph-flags{position:absolute;left:10px;top:10px;display:flex;gap:4px}
.dish .edit{top:auto;bottom:auto}
.dish-main{flex:1;height:auto}
.dish .edit{position:absolute;right:8px;top:8px;opacity:1;background:rgba(10,18,15,.5);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dish .edit:hover{background:rgba(10,18,15,.8);color:#fff}
.dish-ph:has(.ph-empty){aspect-ratio:5/1}
.dish-ph .ph-empty b{font-size:26px}
.dish-top{padding-right:0}
.rc-ph:has(.ph-empty){aspect-ratio:5/1}
.rc-ph .ph-empty b{font-size:26px}
.dish.is-hidden .dish-main{opacity:.55}
.dish.nocard .dish-ph{opacity:.8}
.rc{padding:0;overflow:hidden;gap:0}
.rc-ph{position:relative;aspect-ratio:16/8;max-width:100%;background:var(--surface-2);overflow:hidden}
.rc-ph .vb{position:absolute;left:10px;top:10px}
.rc-body{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px}
.hero{grid-template-columns:220px minmax(0,1fr) auto auto}
.hero-ph{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.hero-ph .ph-empty b{font-size:72px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr) auto}.hero-ph{grid-column:1/-1;aspect-ratio:16/9}}
@media (max-width:700px){.hero-acts{grid-column:1/-1}}
.dlg-ph{display:flex;align-items:center;gap:14px}
#dlgThumb{width:120px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;text-align:center;padding:4px;flex:none}
#dlgThumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}

/* Schritte */
.steps{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start}
.step-no{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 14px var(--f-mono)}
.step-body{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.step-body textarea{min-height:0;resize:vertical}
.step-ph{position:relative;width:min(320px,100%);aspect-ratio:4/3;border-radius:12px;overflow:hidden}
.step-ph img{width:100%;height:100%;object-fit:cover}
.step-acts{display:flex;flex-direction:column}
@media (max-width:560px){.step{grid-template-columns:28px minmax(0,1fr)}.step-no{width:28px;height:28px;font-size:12px}.step-acts{grid-column:2;flex-direction:row}}
.btn.ghost{background:transparent;border-style:dashed}

/* Schalter */
.togs{display:flex;flex-wrap:wrap;gap:8px 18px}
.tog{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog span{position:relative;width:38px;height:22px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);transition:background .15s;flex:none}
.tog span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.tog input:checked + span{background:var(--accent);border-color:var(--accent)}
.tog input:checked + span::after{transform:translateX(16px)}
.tog input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.sm-ta{min-height:70px}

/* Gästekarte: Werkzeuge + Vorschau */
.guest-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.guest-tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.guest-tools .seg{align-self:flex-start}
.guest-prev{min-width:0}
@media (max-width:1000px){.guest-wrap{grid-template-columns:minmax(0,1fr)}.guest-tools{position:static}}

/* Die Karte selbst: eigenes Druckobjekt mit festen Farben je Stil */
.g-paper{--gp:#f6efe2;--gi:#20352c;--ga:#c8742f;--gm:#6b6457;max-width:860px;margin:0 auto;background:var(--gp);color:var(--gi);border-radius:6px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);padding:clamp(28px,6vw,64px) clamp(20px,6vw,68px);font-family:"Cormorant Garamond",Georgia,serif}
.g-head{text-align:center;margin-bottom:clamp(26px,5vw,44px)}
.g-mark-logo{font:600 13px/1 var(--f-body);letter-spacing:.32em;text-transform:uppercase}
.g-mark-logo span{color:var(--ga)}
.g-title{font:500 clamp(44px,8vw,76px)/1 "Cormorant Garamond",Georgia,serif;font-style:italic;margin:14px 0 8px;letter-spacing:-.01em}
.g-sub{font:500 13px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gm)}
.g-sec{margin-top:clamp(26px,5vw,40px);break-inside:avoid-page}
.g-h{display:flex;align-items:center;gap:16px;font:600 13px/1 var(--f-body);letter-spacing:.28em;text-transform:uppercase;color:var(--ga);margin:0 0 18px}
.g-h::before,.g-h::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.g-list{display:flex;flex-direction:column;gap:16px}
.g-item{display:flex;gap:16px;align-items:flex-start;break-inside:avoid}
.g-ph{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--ga)}
.g-txt{flex:1;min-width:0}
.g-row{display:flex;align-items:baseline;gap:10px}
.g-n{font:600 22px/1.2 "Cormorant Garamond",Georgia,serif}
.g-row .lead{flex:1;min-width:20px;border-bottom:1.5px dotted currentColor;opacity:.35;transform:translateY(-5px)}
.g-p{font:600 16px var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-d{font:400 17px/1.35 "Cormorant Garamond",Georgia,serif;font-style:italic;color:var(--gm);margin-top:2px}
.g-a{font:500 11px var(--f-mono);letter-spacing:.08em;color:var(--gm);margin-top:4px}
.g-top{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ga);margin-top:2px}
.g-mark{font:700 10px/1 var(--f-body);font-style:normal;letter-spacing:.04em;border:1px solid currentColor;border-radius:4px;padding:2px 4px;vertical-align:3px;color:var(--ga)}
.g-foot{margin-top:clamp(30px,6vw,52px);padding-top:20px;border-top:1px solid color-mix(in srgb,var(--gi) 25%,transparent);font:400 13px/1.5 var(--f-body);color:var(--gm);text-align:center}
.g-keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px;margin-bottom:10px}
.g-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12px;margin-bottom:10px}
.g-leg b{font-family:var(--f-mono)}
.g-foot p{margin:0}
.g-empty{text-align:center;color:var(--gm)}
.g-alpin{--gp:#183128;--gi:#f3ead8;--ga:#f0a463;--gm:#b9c3b4;background-image:radial-gradient(ellipse at top,rgba(240,164,99,.12),transparent 60%)}
.g-klassisch{--gp:#fbf9f4;--gi:#1e1c19;--ga:#8a6a3b;--gm:#6f6a61}
.g-klassisch .g-item{text-align:center;flex-direction:column;align-items:center;gap:8px}
.g-klassisch .g-row{justify-content:center}
.g-klassisch .g-row .lead{display:none}
.g-klassisch .g-ph{width:120px;height:80px;border-radius:4px;border:0}
.g-klassisch .g-p::before{content:"€ ";opacity:.6}
.g-modern{--gp:#ffffff;--gi:#16201c;--ga:#e2702a;--gm:#626c67;font-family:var(--f-body)}
.g-modern .g-title{font:800 clamp(40px,7vw,64px)/1 var(--f-display);font-style:normal;letter-spacing:-.04em}
.g-modern .g-h{justify-content:flex-start;letter-spacing:.18em}
.g-modern .g-h::before{display:none}
.g-modern .g-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.g-modern .g-item{flex-direction:column;gap:0;border:1px solid #e6e9e5;border-radius:14px;overflow:hidden}
.g-modern .g-ph{width:100%;height:auto;aspect-ratio:16/10;border-radius:0;border:0}
.g-modern .g-txt{padding:12px 14px 14px}

.cloud-form{display:flex;flex-direction:column;gap:12px}

.cloud-chip.ok{background:var(--good-bg);color:var(--good)} .cloud-chip.busy{background:var(--accent-soft);color:var(--accent)} .cloud-chip.err,.cloud-chip.offline{background:var(--bad-bg);color:var(--bad)}
.side .cloud-chip{margin:0 8px;align-self:flex-start}

/* ===== Hauskarte: ein festes System. Papier, Schrift, Raster gleich; je Saison nur --hk-a ===== */
.hk-paper{--hk-p:#f4f0e7;--hk-i:#1f1e1b;--hk-m:#6f6a61;--hk-r:#d3ccbf;--hk-a:#8e2f2a;
  --hk-serif:"Source Serif 4",Georgia,"Times New Roman",serif;--hk-sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  container-type:inline-size;max-width:860px;margin:0 auto;background:var(--hk-p);color:var(--hk-i);font-family:var(--hk-serif);
  padding:clamp(22px,5vw,56px) clamp(18px,5vw,60px) clamp(20px,4vw,40px);box-shadow:0 1px 0 var(--hk-r),0 24px 48px -32px rgba(0,0,0,.35)}
.hk-paper *{box-sizing:border-box}
/* Kopf */
.hk-head{display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--hk-i);margin-bottom:12px}
.hk-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px}
.hk-wm{font:600 13px/1 var(--hk-sans);letter-spacing:.06em}
.hk-wm i{font-style:normal;color:var(--hk-a)}
.hk-season{font:600 11px/1 var(--hk-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--hk-a)}
.hk-dict{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hk-word{font:600 clamp(40px,8cqi,60px)/.95 var(--hk-serif);letter-spacing:-.02em;font-optical-sizing:auto}
.hk-gloss{font:400 15px/1.3 var(--hk-serif);color:var(--hk-m)}
.hk-gloss i{font-style:italic}
.hk-place{font:500 12px/1.4 var(--hk-sans);color:var(--hk-m);text-align:right;max-width:320px}
.hk-motto{grid-column:1/-1;margin:14px 0 0;font:italic 400 15px/1.4 var(--hk-serif);color:var(--hk-m)}
.hk-head.small{grid-template-columns:1fr;padding-bottom:10px}
.hk-head.small .hk-top{margin-bottom:0}
.hk-cover{margin:18px 0 6px}
.hk-cover img{display:block;width:100%;max-width:100%;aspect-ratio:3/1.4;object-fit:cover}
/* Abschnitts-Index (nur schmal) */
.hk-index{display:none;gap:16px;overflow-x:auto;padding:10px 0 4px;margin-bottom:4px;scrollbar-width:none}
.hk-index button{flex:none;border:0;background:none;padding:4px 0;font:600 12px var(--hk-sans);color:var(--hk-m);cursor:pointer;border-bottom:1px solid transparent}
.hk-index button:hover{color:var(--hk-i);border-bottom-color:var(--hk-a)}
/* Raster */
.hk-cols{columns:2;column-gap:44px;padding-top:6px}
.hk-cols.one{columns:1;max-width:440px}
@container (max-width:620px){.hk-cols{columns:1}.hk-index{display:flex}.hk-head{grid-template-columns:1fr}.hk-place{text-align:left;max-width:none}}
.hk-sec{break-inside:auto;padding-top:26px}
.hk-sec:first-child,.hk-special + .hk-sec{padding-top:18px}
.hk-h{margin:0 0 10px;padding-bottom:5px;border-bottom:.5px solid var(--hk-a);font:600 12.5px/1.2 var(--hk-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--hk-i);break-after:avoid}
.hk-sheet-title{font:600 26px/1.1 var(--hk-serif);margin:18px 0 4px}
/* Gericht */
.hk-dish{position:relative;break-inside:avoid;padding:6px 0 7px}
.hk-l1,.hk-var{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:10px;align-items:baseline}
.hk-n{font:600 17px/1.3 var(--hk-serif);text-wrap:pretty}
.hk-diet{font:500 10.5px var(--hk-sans);color:var(--hk-a);margin-left:6px;letter-spacing:.02em;vertical-align:1px}
.hk-p{font:600 16px/1.3 var(--hk-serif);font-variant-numeric:lining-nums tabular-nums;text-align:right;white-space:nowrap}
.hk-d{margin:1px 66px 0 0;font:400 14.5px/1.42 var(--hk-serif);color:var(--hk-m);text-wrap:pretty}
.hk-alg{font:500 10.5px/1 var(--hk-sans);letter-spacing:.06em;color:var(--hk-m);margin-left:8px;white-space:nowrap;opacity:.85}
.hk-var{margin-top:2px}
.hk-var span:first-child{font:500 13px/1.4 var(--hk-sans);color:var(--hk-m)}
.hk-dish.sig::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:2px;background:var(--hk-a)}
.hk-sigkey{display:inline-block;width:2px;height:11px;background:var(--hk-a);vertical-align:-1px;margin:0 3px 0 1px}
/* Aktion */
.hk-special{break-inside:avoid;border:.5px solid var(--hk-r);border-top:2px solid var(--hk-a);padding:12px 14px 8px;margin:14px 0 6px;background:color-mix(in srgb,var(--hk-p) 70%,#fff)}
.hk-sp-label{font:600 10.5px/1.3 var(--hk-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--hk-a)}
.hk-sp-title{margin:4px 0 2px;font:600 22px/1.15 var(--hk-serif)}
.hk-sp-note{margin:0 0 6px;font:500 12.5px/1.4 var(--hk-sans);color:var(--hk-m)}
.hk-special.page{border:0;background:none;padding:18px 0 0;margin:0}
.hk-special.page .hk-sp-title{font-size:clamp(28px,6cqi,38px);margin:8px 0 6px}
.hk-tk{max-width:560px}
.hk-kids{max-width:560px}
/* Fuß */
.hk-foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--hk-i);font:500 11px/1.5 var(--hk-sans);color:var(--hk-m)}
.hk-leg{columns:3 150px;column-gap:18px;margin-bottom:10px}
.hk-leg span{display:block;break-inside:avoid}
.hk-leg b{display:inline-block;min-width:14px;color:var(--hk-i)}
.hk-fl{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hk-empty{color:var(--hk-m)}
/* Werkzeuge */
.acc-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 6px;font-size:12.5px;font-weight:600;cursor:pointer}
.acc i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.acc.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.guest-prev .tk-label{max-width:860px}
@media print{
  body.print-menu #print .hk-paper{box-shadow:none;max-width:none;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-menu #print .hk-cols{columns:2}
  body.print-menu #print .hk-index{display:none}
  body.print-menu #print .hk-paper + .hk-paper{break-before:page}
}
/* ===================== Premium-System: Schiefer & Gold, ruhig, dicht ===================== */
:root{
  --bg:#f7f5f0; --surface:#ffffff; --surface-2:#f1eee7; --fg:#1c1f21; --muted:#6b6f72; --faint:#9a9c9b; --line:#e5e1d8; --line-strong:#d6d0c4;
  --side:#1f2326; --side-2:#2a2f33; --side-fg:#e9e6df; --side-muted:#8e9296;
  --accent:#8a6a36; --accent-2:#e7dcc6; --accent-soft:#f3ecdf; --accent-fg:#ffffff; --gold:#b08d57; --gold-hi:#c9a46a;
  --good:#2f7a55; --good-bg:#e6f0ea; --warn:#a86b12; --warn-bg:#f6ecd9; --bad:#b23b2e; --bad-bg:#f6e3e0;
  --s1:#8a6a36; --s2:#b08d57; --s3:#cdb289; --s4:#6b6f72; --s5:#9a9c9b; --s6:#c9c4ba; --s7:#e5e1d8;
  --shadow:none; --float:0 8px 24px -8px rgba(20,22,24,.22),0 0 0 1px rgba(20,22,24,.06);
  --f-display:"Barlow Condensed","Figtree",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-mono:"Figtree",system-ui,sans-serif;
  --r:8px; --r-s:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121416; --surface:#191c1f; --surface-2:#202428; --fg:#ece9e2; --muted:#9a9ea1; --faint:#71767a; --line:#2a2e32; --line-strong:#383d42;
  --side:#0e1012; --side-2:#1d2125; --side-fg:#ece9e2; --side-muted:#80858a;
  --accent:#c9a46a; --accent-2:#4a3d28; --accent-soft:#2a241a; --accent-fg:#16130d; --gold:#c9a46a; --gold-hi:#e0c18a;
  --good:#5fc08e; --good-bg:#16291f; --warn:#e0b45a; --warn-bg:#2e2512; --bad:#f08b7c; --bad-bg:#33191a;
  --s1:#c9a46a; --s2:#a8874f; --s3:#7f6640; --s4:#8e9296; --s5:#6b6f72; --s6:#4a4e52; --s7:#2a2e32;
  --float:0 10px 30px -10px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121416; --surface:#191c1f; --surface-2:#202428; --fg:#ece9e2; --muted:#9a9ea1; --faint:#71767a; --line:#2a2e32; --line-strong:#383d42;
  --side:#0e1012; --side-2:#1d2125; --side-fg:#ece9e2; --side-muted:#80858a;
  --accent:#c9a46a; --accent-2:#4a3d28; --accent-soft:#2a241a; --accent-fg:#16130d; --gold:#c9a46a; --gold-hi:#e0c18a;
  --good:#5fc08e; --good-bg:#16291f; --warn:#e0b45a; --warn-bg:#2e2512; --bad:#f08b7c; --bad-bg:#33191a;
  --s1:#c9a46a; --s2:#a8874f; --s3:#7f6640; --s4:#8e9296; --s5:#6b6f72; --s6:#4a4e52; --s7:#2a2e32;
  --float:0 10px 30px -10px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); color-scheme:dark}
body{font-size:14px;line-height:1.45}
.mono,.num,td.r,.price,.t-v,.big2,.bar-v,.kv span:nth-child(even){font-family:var(--f-body)!important;font-variant-numeric:tabular-nums;letter-spacing:0}
.ost,.tag,.mono.sm{font-variant-numeric:tabular-nums}

/* Typo */
h1{font:500 30px/1.1 var(--f-display);letter-spacing:.005em}
.page-h{margin-bottom:14px;align-items:center}
.page-h h1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.08em;margin-bottom:4px}
.sec-h{font:500 20px/1.2 var(--f-display);letter-spacing:.01em;margin:22px 0 10px}
h2{font-size:14px}
main{padding-block:22px 80px}
main.enter{animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:.6}to{opacity:1}}

/* Seitenleiste */
.side{gap:16px;padding-top:18px;width:auto}
.shell{grid-template-columns:236px minmax(0,1fr)}
.brand{gap:12px}
.logo{width:34px;height:34px;border-radius:0;background:linear-gradient(135deg,#9c7a45,#d2ae72 45%,#f0dcae 52%,#b8925a 60%,#8a6a3b);font-size:0;
  -webkit-mask:url(brand/logo.svg) no-repeat;mask:url(brand/logo.svg) no-repeat;-webkit-mask-size:calc(34px*119.3/64) auto;mask-size:calc(34px*119.3/64) auto;
  -webkit-mask-position:calc(-34px*27.5/64) calc(-34px*7.8/64);mask-position:calc(-34px*27.5/64) calc(-34px*7.8/64)}
.brand b{font:300 21px/1 var(--f-display);letter-spacing:.08em;color:var(--gold-hi)}
.brand small{font-size:11.5px;letter-spacing:.02em;margin-top:5px}
.nav-group{font:600 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:12px 12px 4px;opacity:.8}
.nav-i{padding:8px 12px;border-radius:6px;font-size:14px;position:relative}
.nav-i.on{background:var(--side-2);box-shadow:inset 2px 0 0 var(--gold)}
.nav-i.on .ico{color:var(--gold-hi)}
.kbd-btn{border-radius:6px;padding:7px 10px}
.theme-btn{border-radius:6px}
.topbar .logo{width:30px;height:30px;-webkit-mask-size:calc(30px*119.3/64) auto;mask-size:calc(30px*119.3/64) auto;-webkit-mask-position:calc(-30px*27.5/64) calc(-30px*7.8/64);mask-position:calc(-30px*27.5/64) calc(-30px*7.8/64)}
.bottom .nav-i.on{box-shadow:none;color:var(--accent)}
.bottom .nav-i.on .ico{color:var(--accent)}
.bottom [data-tab="products"]{display:none}

/* Flächen: keine Schatten, kleine Radien, Linien statt Kästen */
.panel,.tile,.dish,.rc,.lo,.oc,.sp-card,.todo button,.hero,.tbl-wrap,.list,.kpis{box-shadow:none!important;border-radius:var(--r)}
.panel{padding:16px}
.panel.accent{background:var(--surface);border-color:var(--line)}
.hero{border-radius:var(--r);padding:20px}
.hero::before{display:none}
.dish:hover,.rc:hover,.tile.click:hover,.todo button:hover{transform:none!important}
.dish:hover,.rc:hover{border-color:var(--line-strong)}
.dish-ph:has(.ph-empty),.rc-ph:has(.ph-empty){display:none}
.dish-top{padding-right:34px}
.dish .edit{background:transparent;color:var(--muted);backdrop-filter:none;-webkit-backdrop-filter:none}
.dish-ph:not(:has(.ph-empty)) ~ .edit{background:rgba(10,12,14,.55);color:#fff}
.dish-n,.rc-n{font:600 15px/1.3 var(--f-body)}
.price{font-weight:600}
.btn{border-radius:6px;padding:7px 14px;font-weight:600}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg);box-shadow:none}
.btn.primary:hover{filter:none;opacity:.88}
.icon-btn{border-radius:6px}
.icon-btn.lg{border-radius:6px}
.chip{border-radius:4px;padding:5px 10px;font-weight:600;font-size:13px}
.chip.on{background:var(--fg);color:var(--bg)}
.seg{border-radius:6px;padding:2px}
.seg button{border-radius:5px;padding:6px 11px}
.seg button.on{box-shadow:0 0 0 1px var(--line)}
.search{border-radius:6px}
input,select,textarea{border-radius:6px}
.ost,.tag,.vb,.alg,.cnt,.cloud-chip,.sp-st{border-radius:4px}
.fc{border-radius:4px}
.note{border-radius:6px;background:var(--surface);border-color:var(--line);color:var(--muted);font-size:12.5px;padding:8px 12px}
.note .ico{color:var(--gold)}
#app:not([data-view="dash"]) .note{display:none}
dialog{border-radius:10px;box-shadow:var(--float)}
#pal .pal-box{border-radius:10px;box-shadow:var(--float)}
#toast{border-radius:6px}
.warn-box,.ok-box{border-radius:6px}
.stackbar,.meter,.bar-t,.lvl{border-radius:2px}
.bar-t i,.meter i,.lvl i{border-radius:2px}
.ring.good .val{stroke:var(--good)}

/* Kennzahlen als schmale Leiste */
.tiles{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.tile{flex:1 1 0;border:0;border-left:1px solid var(--line);border-radius:0;padding:12px 16px;background:transparent;gap:12px;min-width:0}
.tile:first-child{border-left:0}
.tile.click{cursor:pointer}
.tile.click:hover{background:var(--surface-2)}
.tile-ring svg{display:none}
.tile-ring{order:2}
.tile-ring b{position:static;font:600 20px var(--f-body)}
.tile:has(.tile-ring){flex-direction:row-reverse;justify-content:flex-end}
.t-v{font:600 20px/1.15 var(--f-body)}
.t-v small{font-size:13px}

.t-s{font-size:11.5px}
.tile .meter{margin-top:6px;height:3px}
@media (max-width:760px){.tiles{overflow-x:auto;scrollbar-width:none}.tile{flex:0 0 auto;min-width:46%}}

/* Ansicht-Umschalter */
.vsw{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.vsw button{border:0;background:transparent;color:var(--muted);width:34px;height:32px;display:grid;place-items:center;cursor:pointer}
.vsw button + button{border-left:1px solid var(--line)}
.vsw button.on{background:var(--surface-2);color:var(--fg)}
.vsw .ico{width:17px;height:17px}
.toolbar .sp{flex:1}

/* Listen */
.lt-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table.lt{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
table.lt th{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;text-align:left;white-space:nowrap}
table.lt th.r,table.lt td.r{text-align:right}
table.lt th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}

.lt-st{display:inline-flex;gap:4px;align-items:center}
.lt-st span{font:600 10.5px var(--f-body);padding:3px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}

.lt-st span.ok{background:var(--good-bg);color:var(--good)}
.lt-acts{display:flex;justify-content:flex-end;gap:2px}
.lt-acts .icon-btn{width:32px;height:32px}
.lt-price{width:84px;text-align:right;padding:5px 8px;font-weight:600;font-variant-numeric:tabular-nums;border-color:transparent;background:transparent}
.lt-price:hover,.lt-price:focus{border-color:var(--line-strong);background:var(--surface)}
.lt-muted{color:var(--muted)}
.lt.compact td{height:36px}
.lt.compact .lt-n small,.lt.compact .lt-n img{display:none}
@media (max-width:760px){

/* ===== Intro: Schiefer, goldenes Emblem, Lichtkante (Storyboard Motion Design) ===== */
.intro{--e1:cubic-bezier(.22,1,.36,1);--e2:cubic-bezier(.65,0,.35,1);--e3:cubic-bezier(.7,0,.2,1);
  --foil:linear-gradient(115deg,#8a6a3b 0%,#b8925a 30%,#e9cf9b 46%,#fff4da 50%,#d2ae72 54%,#9c7a45 72%,#b8925a 100%);
  position:fixed;inset:0;z-index:200;background:#111213;overflow:hidden;display:grid;place-items:center;cursor:pointer;
  font-family:"Barlow Condensed","Figtree",sans-serif}
.intro *{box-sizing:border-box}
.in-table{position:absolute;inset:0;background:#2a2118 url(brand/table.webp) center/cover;filter:brightness(.55) saturate(.9);opacity:0}
.in-scene{position:relative;width:min(92vw,128dvh);aspect-ratio:1400/841;opacity:0}
.in-plate{position:absolute;inset:0;width:100%;height:100%;max-width:none;filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
.in-knife,.in-fork{position:absolute;height:112%;top:-6%;width:auto;max-width:none;filter:drop-shadow(-6px 14px 14px rgba(0,0,0,.35));opacity:0}
.in-knife{right:-3%}
.in-fork{right:6.5%}
/* Karte: Fläche des Schiefers auf dem Teller (Lage aus dem Foto vermessen) */
.in-card{position:absolute;left:16.86%;top:11.89%;width:63.36%;height:75.62%;container-type:size}
.in-flap{position:absolute;right:0;top:0;width:27%;aspect-ratio:1;container-type:inline-size;background:#f7f4ee;clip-path:polygon(100% 0,100% 0,100% 0);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.in-flap span{position:absolute;left:64%;top:36%;width:80%;transform:translate(-50%,-50%) rotate(45deg);text-align:center;color:#b8925a;font-weight:600;text-transform:uppercase;line-height:.92;font-size:10.5cqw;letter-spacing:.01em;opacity:0}
.in-flap b{display:block;font-size:1.6em;font-weight:700;margin-top:.04em}
.in-mark{position:absolute;left:50%;top:16%;width:min(31cqw,42cqh);aspect-ratio:1;transform:translateX(-50%)}
.in-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.in-ring circle{fill:none;stroke:#c59c69;stroke-width:.55;stroke-dasharray:198;stroke-dashoffset:198;transform:rotate(-90deg);transform-origin:50% 50%}
.in-em-wrap{position:absolute;inset:0;clip-path:circle(0% at 50% 50%);opacity:0}
.in-gold{position:absolute;background:var(--foil);background-size:320% 100%;background-position:100% 0;
  -webkit-mask:url(brand/logo.svg) no-repeat;mask:url(brand/logo.svg) no-repeat}
.in-emblem{inset:0;-webkit-mask-size:calc(100% * 119.3/64) auto;mask-size:calc(100% * 119.3/64) auto;-webkit-mask-position:calc(27.5/(119.3 - 64) * 100%) calc(7.8/(121.8 - 64) * 100%);mask-position:calc(27.5/(119.3 - 64) * 100%) calc(7.8/(121.8 - 64) * 100%)}
.in-word{left:50%;top:66%;width:min(42cqw,58cqh);aspect-ratio:90/20;transform:translateX(-50%);clip-path:inset(0 50% 0 50%);opacity:0;
  -webkit-mask-size:calc(100% * 119.3/90) auto;mask-size:calc(100% * 119.3/90) auto;-webkit-mask-position:calc(15/(119.3 - 90) * 100%) calc(80/(121.8 - 20) * 100%);mask-position:calc(15/(119.3 - 90) * 100%) calc(80/(121.8 - 20) * 100%)}
.in-sub{left:50%;top:82.5%;width:min(28cqw,39cqh);aspect-ratio:61/11;transform:translateX(-50%);opacity:0;
  -webkit-mask-size:calc(100% * 119.3/61) auto;mask-size:calc(100% * 119.3/61) auto;-webkit-mask-position:calc(29/(119.3 - 61) * 100%) calc(104.8/(121.8 - 11) * 100%);mask-position:calc(29/(119.3 - 61) * 100%) calc(104.8/(121.8 - 11) * 100%)}
.in-iris{display:none}

/* Telefon & Hochformat: nur Schiefer, bildschirmfüllend */
@media (orientation:portrait),(max-width:760px){
  .in-table,.in-plate,.in-knife,.in-fork{display:none}
  .in-scene{width:100%;height:100%;aspect-ratio:auto;background:#1a1b1c url(brand/slate.webp) center/cover}
  .in-scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(10,11,12,.55))}
  .in-card{left:0;top:0;width:100%;height:100%;z-index:1}
  .in-mark{top:20%;width:min(64cqw,36cqh)}
  .in-word{top:calc(20% + min(64cqw,36cqh) + 6cqh);width:min(74cqw,46cqh)}
  .in-sub{top:calc(20% + min(64cqw,36cqh) + 6cqh + min(74cqw,46cqh) * 20/90 + 2.4cqh);width:min(50cqw,31cqh)}
  .in-flap{width:min(34cqw,30cqh);top:env(safe-area-inset-top,0px)}
}

/* Ablauf (läuft, sobald die Bilder bereit sind) */
.intro.play .in-table{animation:inFade .5s var(--e1) forwards;--o:1}
.intro.play .in-scene{animation:inScene .45s var(--e1) forwards}
.intro.play .in-knife{animation:inCut .7s var(--e1) .35s forwards}
.intro.play .in-fork{animation:inCut .7s var(--e1) .45s forwards}
.intro.play .in-ring circle{animation:inRing .85s var(--e2) .25s forwards, inFadeOut .3s linear 1.15s forwards}
.intro.play .in-em-wrap{animation:inIris .7s var(--e2) .45s forwards}
.intro.play .in-emblem{animation:inSweep .6s var(--e3) .95s forwards}
.intro.play .in-word{animation:inWord .5s var(--e1) 1s forwards, inSweep .6s var(--e3) 1.13s forwards}
.intro.play .in-sub{animation:inSub .42s var(--e1) 1.18s forwards}
.intro.play .in-flap{animation:inFlap .45s var(--e1) 1.25s forwards}
.intro.play .in-flap span{animation:inFade .25s linear 1.5s forwards}
.intro.out{animation:inOut .55s var(--e3) forwards}
.intro.quick{animation:inOut .32s ease forwards}
@keyframes inFade{to{opacity:1}}
@keyframes inFadeOut{to{opacity:0}}
@keyframes inScene{from{opacity:0;transform:scale(1.035);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes inCut{from{opacity:0;transform:translateX(40%)}to{opacity:1;transform:none}}
@keyframes inRing{to{stroke-dashoffset:0}}
@keyframes inIris{from{clip-path:circle(0% at 50% 50%);opacity:0;transform:scale(.97)}to{clip-path:circle(72% at 50% 50%);opacity:1;transform:none}}
@keyframes inSweep{from{background-position:100% 0}to{background-position:0% 0}}
@keyframes inWord{from{clip-path:inset(0 50% 0 50%);opacity:0;transform:translate(-50%,6px);filter:blur(3px)}to{clip-path:inset(0 0 0 0);opacity:1;transform:translate(-50%,0);filter:none}}
@keyframes inSub{from{opacity:0;transform:translate(-50%,4px)}to{opacity:.92;transform:translate(-50%,0)}}
@keyframes inFlap{to{clip-path:polygon(0 0,100% 0,100% 100%)}}
@keyframes inOut{to{opacity:0;transform:scale(1.04);filter:blur(6px);visibility:hidden}}
@keyframes inIrisOpen{to{clip-path:circle(150% at 50% 42%)}}
@media (prefers-reduced-motion: reduce){
  .intro.play *{animation:none!important}
  .intro.play .in-table{opacity:1} .intro.play .in-scene,.intro.play .in-knife,.intro.play .in-fork{opacity:1}
  .intro.play .in-em-wrap{clip-path:none;opacity:1} .intro.play .in-word{clip-path:none;opacity:1} .intro.play .in-sub{opacity:.92} .intro.play .in-flap{clip-path:polygon(0 0,100% 0,100% 100%)} .intro.play .in-flap span{opacity:1} .intro.play .in-ring{display:none}
  .intro.play{animation:inFade .2s linear}
  .intro.out,.intro.quick{animation:inOut .3s linear forwards!important}
}
/* ===== Intro „Kerzenschein“: Licht wie von einer Kerze außerhalb des Bildes ===== */
@property --lr{syntax:'<length>';inherits:true;initial-value:0px}
.intro.v-candle{--ox:34%;--oy:84%;--lr:0px;background:#0d0f10}
.intro.v-candle .in-table,.intro.v-candle .in-scene{display:none}
.intro:not(.v-candle) .ic{display:none}
.ic{position:absolute;inset:0}
.ic-slate{background:#16181a url(brand/slate.webp) center/cover;filter:contrast(1.12) brightness(.85)}
.ic-tint{background:radial-gradient(circle at var(--ox) var(--oy),rgba(255,176,96,.24),transparent 55%);mix-blend-mode:soft-light;opacity:0}
.ic-stage{container-type:size}
.ic-gold{position:absolute;background:#c59c69;-webkit-mask:url(brand/logo.svg) no-repeat;mask:url(brand/logo.svg) no-repeat}
.ic-spec{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,241,214,.85) 48%,transparent 66%) 30% 0/260% 100% no-repeat;mix-blend-mode:screen;opacity:0}
.ic-mark{left:50%;top:44%;width:min(24vmin,38cqh);aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;filter:blur(6px)}
.ic-mark{-webkit-mask-size:calc(100% * 119.3/64) auto;mask-size:calc(100% * 119.3/64) auto;-webkit-mask-position:calc(27.5/(119.3 - 64) * 100%) calc(7.8/(121.8 - 64) * 100%);mask-position:calc(27.5/(119.3 - 64) * 100%) calc(7.8/(121.8 - 64) * 100%)}
.ic-word{left:50%;top:calc(44% + min(24vmin,38cqh)/2 + 5cqh);width:min(34vmin,52cqh);aspect-ratio:90/20;transform:translate(-50%,8px);opacity:0;filter:blur(2px);
  -webkit-mask-size:calc(100% * 119.3/90) auto;mask-size:calc(100% * 119.3/90) auto;-webkit-mask-position:calc(15/(119.3 - 90) * 100%) calc(80/(121.8 - 20) * 100%);mask-position:calc(15/(119.3 - 90) * 100%) calc(80/(121.8 - 20) * 100%)}
.ic-sub{left:50%;top:calc(44% + min(24vmin,38cqh)/2 + 5cqh + min(34vmin,52cqh)*20/90 + 2cqh);width:min(22vmin,34cqh);aspect-ratio:61/11;transform:translate(-50%,8px);opacity:0;filter:blur(2px);
  -webkit-mask-size:calc(100% * 119.3/61) auto;mask-size:calc(100% * 119.3/61) auto;-webkit-mask-position:calc(29/(119.3 - 61) * 100%) calc(104.8/(121.8 - 11) * 100%);mask-position:calc(29/(119.3 - 61) * 100%) calc(104.8/(121.8 - 11) * 100%)}
.ic-gerlos{position:absolute;left:0;right:0;top:86%;text-align:center;font:300 clamp(11px,1.5vmin,15px)/1 "Barlow Condensed",sans-serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(239,230,214,.7);opacity:0}
.ic-dark{background:radial-gradient(circle at var(--ox) var(--oy),transparent 0,transparent calc(var(--lr)*.32),rgba(13,15,16,.55) calc(var(--lr)*.7),#0d0f10 var(--lr))}
.ic-ember{position:absolute;left:var(--ox);top:var(--oy);width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#ffd9a0;filter:blur(3px);box-shadow:0 0 18px 6px rgba(255,190,110,.55);opacity:0;transform:scale(.3)}
.ic-skip{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;background:none;color:rgba(239,230,214,.6);font:500 13px "Figtree",sans-serif;letter-spacing:.04em;cursor:pointer;padding:8px;opacity:0}
@media (orientation:portrait),(max-width:760px){
  .intro.v-candle{--ox:50%;--oy:82%}
  .ic-mark{width:58vw;top:38%}
  .ic-word{width:64vw;top:calc(38% + 29vw + 4.5cqh)}
  .ic-sub{width:40vw;top:calc(38% + 29vw + 4.5cqh + 64vw*20/90 + 2cqh)}
  .ic-gerlos{top:88%}
}
.intro.v-candle.play{animation:icLight 2.05s cubic-bezier(.16,1,.3,1) .18s forwards}
@keyframes icLight{0%{--lr:0px}38%{--lr:92vmax}100%{--lr:98vmax}}
.intro.v-candle.play .ic-ember{animation:icEmber .18s cubic-bezier(.2,.8,.2,1) forwards,inFadeOut .4s linear .2s forwards}
.intro.v-candle.play .ic-tint{animation:inFade .77s linear .18s forwards}
.intro.v-candle.play .ic-dark{animation:icFlicker 1.1s ease-in-out .9s 1}
.intro.v-candle.play .ic-mark{animation:icMark .8s cubic-bezier(.22,.61,.36,1) .45s forwards}
.intro.v-candle.play .ic-mark .ic-spec,.intro.v-candle.play .ic-word .ic-spec{animation:icSpec 1.1s ease-in-out .9s forwards}
.intro.v-candle.play .ic-word{animation:icRise .5s cubic-bezier(.2,.7,.2,1) 1.15s forwards}
.intro.v-candle.play .ic-sub{animation:icRise .5s cubic-bezier(.2,.7,.2,1) 1.29s forwards}
.intro.v-candle.play .ic-gerlos{animation:icGerlos .35s cubic-bezier(.2,.7,.2,1) 1.6s forwards}
.intro.v-candle.play .ic-skip{animation:inFade .4s linear .6s forwards}
@keyframes icEmber{to{opacity:1;transform:scale(1)}}
@keyframes icMark{to{opacity:1;filter:none}}
@keyframes icRise{to{opacity:1;filter:none;transform:translate(-50%,0)}}
@keyframes icGerlos{to{opacity:1;letter-spacing:.28em}}
@keyframes icSpec{0%{opacity:0;background-position:30% 0}30%{opacity:.3}70%{opacity:.3}100%{opacity:0;background-position:62% 0}}
@keyframes icFlicker{0%{opacity:1;transform:none}25%{opacity:.95;transform:translate(.6%,-.4%)}50%{opacity:1;transform:translate(-.4%,.2%)}75%{opacity:.97;transform:translate(.3%,.5%)}100%{opacity:1;transform:none}}
/* Ausgang: Licht füllt den Raum, Emblem fliegt an seinen Platz in der App */
.intro.v-candle.out{animation:icOut .7s cubic-bezier(.65,0,.35,1) forwards}
.intro.v-candle.out .ic-dark,.intro.v-candle.out .ic-slate,.intro.v-candle.out .ic-tint{animation:inFadeOut .55s linear forwards}
.intro.v-candle.out .ic-word,.intro.v-candle.out .ic-sub,.intro.v-candle.out .ic-gerlos,.intro.v-candle.out .ic-skip{animation:inFadeOut .3s linear forwards}
.intro.v-candle .ic-mark.fly{transition:transform .6s cubic-bezier(.65,0,.35,1),opacity .2s linear .5s}
@keyframes icOut{0%{background-color:#0d0f10}60%{background-color:rgba(31,35,38,.6)}100%{background-color:transparent;visibility:hidden}}
@media (prefers-reduced-motion: reduce){
  .intro.v-candle.play{--lr:98vmax;animation:inFade .4s linear}
  .intro.v-candle.play .ic-mark,.intro.v-candle.play .ic-word,.intro.v-candle.play .ic-sub{opacity:1;filter:none;transform:translate(-50%,-50%)}
  .intro.v-candle.play .ic-word,.intro.v-candle.play .ic-sub{transform:translate(-50%,0)}
  .intro.v-candle.play .ic-gerlos,.intro.v-candle.play .ic-tint{opacity:1}
  .intro.v-candle.out{animation:inOut .35s linear forwards!important}
}

/* ---------- Berechnung ---------- */
function line(it, depth){
  const res = {name:'Zutat wählen', unit:'g', grossG:0, net:0, out:0, cost:0, alg:new Set(), missing:true, netAuto:0};
  const r = refObj(it.ref); if(!r) return res;
  res.missing = false;
  const q = +it.qty || 0;
  if(r.t === 'p'){
    const p = r.o; res.name = p.name;
    if(p.unit === 'Stk'){ res.unit = 'Stk'; res.cost = q * fin(+p.price); res.grossG = q * fin(+p.pieceG); }
    else { res.unit = p.unit === 'l' ? 'ml' : 'g'; res.cost = q/1000 * fin(+p.price); res.grossG = q; }
    res.netAuto = res.grossG * (1 - fin(+p.lossCold)/100);
    res.net = it.net !== '' && it.net != null ? +it.net : res.netAuto;
    res.out = res.net * (1 - fin(+p.lossHot)/100);
    algList(p.alg).forEach(a => res.alg.add(a));
  } else {
    const c = r.o; res.name = 'BR · ' + c.name; res.grossG = q;
    const t = totals(c, depth+1);
    { const y = +c.yieldG || t.out; res.cost = y ? q * t.cost / y : 0; }
    res.netAuto = q; res.net = it.net !== '' && it.net != null ? +it.net : q; res.out = res.net;
    t.alg.forEach(a => res.alg.add(a));
  }
  return res;
}
function totals(c, depth=0){
  const t = {cost:0, gross:0, net:0, out:0, alg:new Set(), lines:[]};
  if(!c || depth > 6) return t;
  for(const it of c.items){ const l = line(it, depth); t.lines.push(l); t.cost += l.cost; t.gross += l.grossG; t.net += l.net; t.out += l.out; l.alg.forEach(a => t.alg.add(a)); }
  return t;
}
function menuCalc(m){
  const c = m.card ? C(m.card) : null;
  const t = c ? totals(c) : null;
  const netPrice = (+m.price||0) / (1 + S.settings.vat/100);
  const cost = t ? t.cost : null;
  return {c, t, cost, netPrice, fc: cost!=null && netPrice ? cost/netPrice*100 : null, margin: cost!=null ? netPrice - cost : null};
}
function fcClass(fc){ if(fc==null) return 'na'; const tg = +S.settings.target; return fc <= tg ? 'good' : fc <= tg+7 ? 'warn' : 'bad'; }
function fcBadge(fc){ return `<span class="fc ${fcClass(fc)}">${fc==null ? 'keine Rezeptur' : pct(fc)}</span>`; }
function chips(set){ const a = [...set].sort(); return a.length ? `<div class="chips">${a.map(x=>`<span class="alg" title="${esc(ALG[x]||x)}">${esc(x)}</span>`).join('')}</div>` : ''; }
function usage(ref){ return S.cards.filter(c => c.items.some(i => i.ref === ref)); }

function migrate(d){
  if(!d || typeof d !== 'object') return null;
  if(!Array.isArray(d.products) || !Array.isArray(d.cards) || !Array.isArray(d.menu)) return null;
  d.settings = Object.assign({name:'Mein Betrieb', vat:10, target:28, nextNo:d.cards.length+1}, d.settings||{});
  if(!(+d.settings.target >= 1)) d.settings.target = 28; if(!(+d.settings.vat >= 0)) d.settings.vat = 10;
  d.products = d.products.filter(p=>p && p.id); d.products.forEach(p=>{ p.name = p.name||p.id; p.unit = ['kg','l','Stk'].includes(p.unit)?p.unit:'kg'; p.price = +p.price||0; p.alg = p.alg||''; });
  d.cards = d.cards.filter(c=>c && c.id); d.cards.forEach(c=>{ c.name = c.name||'Rezeptur'; c.type = c.type==='semi'?'semi':'dish'; if(!Array.isArray(c.items)) c.items = []; c.items = c.items.filter(i=>i && typeof i==='object'); if(c.steps && !Array.isArray(c.steps)) c.steps = []; });
  d.menu = d.menu.filter(m=>m && m.id); d.menu.forEach(m=>{ m.name = m.name||'Gericht'; m.section = m.section||'Ohne Kategorie'; m.price = +m.price||0; m.desc = m.desc||''; });
  d.products.forEach(p => { if(p.stock==null){ const s = d.demo && DEMO_STOCK[p.id]; [p.stock,p.minStock,p.loc,p.supplier] = s || [0,0,'L','']; } if(p.id==='water') p.noStock = true; });
  d.cards.forEach(c => { if(!c.steps){ c.steps = splitSteps(c.method); delete c.method; } if(c.img==null) c.img=''; });
  const order = {};
  d.menu.forEach(m => { if(m.order==null){ order[m.section] = (order[m.section]||0); m.order = order[m.section]++; } if(m.img==null) m.img=''; if(m.veg==null) m.veg=''; });
  if(!d.settings.sections) d.settings.sections = [...SECTION_ORDER];
  if(!d.settings.guest) d.settings.guest = {style:'alpin', photos:true, allergens:true, desc:true, title:'Speisekarte', subtitle:'', footer:'Alle Preise in Euro inkl. MwSt.'};
  d.moves = d.moves || []; d.inventories = d.inventories || []; if(d.invDraft===undefined) d.invDraft = null;
  seasonMigrate(d);
  einkaufMigrate(d);
  menuV2Migrate(d);
  salesEnsure(d); if(d.demo && !d.salesDemoDone) salesDemo(d);
  pricesMigrate(d);
  gameMigrate(d);
  return d;
}

const IMG = {}; let idb = null;
function idbOpen(){ return new Promise(res => { try { const r = indexedDB.open('dahuam202_fotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch(e){ res(null); } }); }
async function imgLoadAll(){ idb = await idbOpen(); if(!idb) return; await new Promise(res => { try { const rq = idb.transaction('img').objectStore('img').openCursor(); rq.onsuccess = () => { const c = rq.result; if(c){ IMG[c.key] = c.value; c.continue(); } else res(); }; rq.onerror = () => res(); } catch(e){ res(); } }); }
function imgPut(id, data){ IMG[id] = data; try { idb && idb.transaction('img','readwrite').objectStore('img').put(data, id); } catch(e){} }
function imgDel(id){ if(!id) return; delete IMG[id]; try { idb && idb.transaction('img','readwrite').objectStore('img').delete(id); } catch(e){} }
function resizeImage(file, max=1400){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
    const k = Math.min(1, max/Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', 0.82)); }; im.src = fr.result; }; fr.readAsDataURL(file); });
}

/* ---------- Lager-Logik ---------- */
function unitOf(p){ return p ? p.unit : ''; }
function qtyFmt(q, p){ const d = p && p.unit==='Stk' ? 0 : (Math.abs(q) < 10 ? 2 : 1); return num(q, d)+' '+unitOf(p); }
function stockProducts(){ return S.products.filter(p => !p.noStock); }
function stockValue(){ return stockProducts().reduce((s,p)=>s + Math.max(0,+p.stock||0)*(+p.price||0), 0); }
function lowStock(){ return stockProducts().filter(p => (+p.minStock||0) > 0 && (+p.stock||0) < +p.minStock); }
function addMove(type, pid, delta, note='', price=null, date=null){
  const p = P(pid); if(!p || !delta) return;
  p.stock = Math.round(((+p.stock||0) + delta)*1000)/1000;
  S.moves.unshift({id:uid('mv'), date: date || new Date().toISOString(), type, pid, qty:delta, price: price ?? p.price, note});
}
function explode(c, f, acc=new Map(), d=0){
  if(!c || d > 6) return acc;
  for(const it of c.items){ const r = refObj(it.ref); if(!r) continue; const q = (+it.qty||0)*f;
    if(r.t==='p'){ if(r.o.noStock) continue; acc.set(r.o.id, (acc.get(r.o.id)||0) + (r.o.unit==='Stk' ? q : q/1000)); }
    else { const y = +r.o.yieldG || totals(r.o).out; if(y) explode(r.o, q/y, acc, d+1); } }
  return acc;
}
function orderSuggest(p){ const min = +p.minStock||0, s = +p.stock||0; let q = Math.max(0, min*2 - s); if(p.unit==='Stk') return Math.ceil(q); return Math.ceil(q*2)/2; }

/* ---------- Karten-Reihenfolge ---------- */
function secList(){ const s = S.settings.sections; for(const m of S.menu) if(m.section && !s.includes(m.section)) s.push(m.section); return s; }
function menuSorted(){ const s = secList(); return [...S.menu].sort((a,b) => s.indexOf(a.section) - s.indexOf(b.section) || (a.order??0) - (b.order??0)); }
function nextOrder(sec){ return S.menu.filter(m=>m.section===sec).reduce((mx,m)=>Math.max(mx, m.order??0), -1) + 1; }
function moveItem(id, dir){
  const m = S.menu.find(x=>x.id===id); const list = menuSorted().filter(x=>x.section===m.section); list.forEach((x,i)=>x.order=i);
  const i = list.indexOf(m), j = i+dir; if(j<0 || j>=list.length) return; [list[i].order, list[j].order] = [list[j].order, list[i].order];
}
