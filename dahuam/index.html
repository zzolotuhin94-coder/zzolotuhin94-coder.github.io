.f input,.f select{font-size:14px}
dialog{border-radius:10px}
.tag,.vb,.alg,.cnt,.ost,.sp-st,.lt-st span,.ti-flag{border-radius:4px;font-weight:600}

/* Flächen: eine Linie statt Kasten im Kasten */
.panel{padding:16px 18px}
.panel-h{margin-bottom:12px}
.panel-h h2{font:500 17px/1.2 var(--f-display);letter-spacing:.01em}
.todo{gap:0}
.todo button{border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 2px}
.todo li:first-child button{border-top:0}
.todo button:hover{background:transparent;color:var(--accent)}
.todo b{font:600 15px var(--f-body)}
.inv-h{border:0;padding:0}
.hints{margin-top:10px;gap:0}
.hints li{border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:8px 0}
.hints li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.hints li.warn::before{background:var(--warn)} .hints li.bad::before{background:var(--bad)}
.teller-ok{display:flex;gap:8px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)} .teller-ok .ico{color:var(--good)}
.empty-s>.ico{width:28px;height:28px;color:var(--muted);stroke-width:1.6}
.empty-s h3{font-size:19px}
.pc-card{box-shadow:none;border-radius:var(--r);animation:none}
.pc-field{border-width:1px;border-color:var(--line-strong)} .pc-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.pc-name{font-size:30px}
.pc-prog{border:0;background:transparent;padding:0 0 12px;max-width:760px}
.pc-done{border-radius:var(--r)}
.lab-card{border-radius:var(--r)}
.lab-ing{background:var(--surface-2);border-color:var(--line-strong)}
.lab-ch .eyebrow{color:var(--faint)}
.lab-go{padding:0;min-height:40px}
.ti{border-radius:var(--r-s)}
.ti-flag{background:transparent;padding:0;color:var(--faint);font-weight:500;font-style:italic;letter-spacing:0}
.ti-flag.bad{background:transparent;color:var(--bad);font-style:normal}
.shelf{background:transparent;border-color:var(--line)}
.sp-card,.oc,.lo{border-radius:var(--r)}

/* Rezeptur: Kopf ohne Kasten */
.hero{border:0;background:transparent;padding:0 0 20px;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:20px;grid-template-columns:168px minmax(0,1fr) auto auto;gap:22px}
.hero-ph{border-radius:var(--r)}
.hero .eyebrow{color:var(--faint);margin-bottom:2px}
.title-in{font:500 clamp(26px,3.2vw,36px)/1.1 var(--f-display);letter-spacing:.005em}
.hero-stats{margin-top:10px;gap:8px 26px}
.hero-stats b{font:500 20px/1.1 var(--f-display)}
.hero-ring b{font:500 20px var(--f-display)}
.hero-acts .icon-btn.lg{background:transparent}
.back{margin-bottom:10px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr) auto}.hero-ph{grid-column:1/-1;aspect-ratio:16/9;max-width:360px}}

/* Kennzahlen: eine schmale Leiste, Ziffern in der Hausschrift */
.tiles{margin-bottom:0}
.tile{padding:12px 16px 13px}
.t-v{font:500 24px/1.1 var(--f-display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.t-v small{font:400 15px var(--f-display);color:var(--faint)}
.t-l{font-size:12px}
.t-s{font-size:11.5px;color:var(--faint)}
#app[data-view="dash"] .tiles,#app[data-view="stock"] .tiles,#app[data-view="buy"] .tiles,#app[data-view="report"] .tiles{margin-bottom:18px}
#app[data-view="dash"] .day .tiles{margin-bottom:0}

/* Heute: Tagesblatt */
.day{display:flex;flex-direction:column;gap:26px}
.day-h{display:flex;align-items:baseline;gap:10px;margin:0;font:500 18px/1.2 var(--f-display);letter-spacing:.01em}
.day-h span{font:400 12.5px var(--f-body);color:var(--faint)}
.rows{list-style:none;margin:6px 0 0;padding:0}
.rw{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:4px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rows .rw:first-child{border-top:0}
.rw-lead{font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);display:flex;align-items:center;gap:6px}
.rw-lead .ico{width:16px;height:16px;color:var(--muted)}
.rw-main{min-width:0} .rw-main b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-main small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-meta{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rw-act{display:flex;justify-content:flex-end;min-width:0}
.rw-act:empty{display:none}
.rw.past{opacity:.55}
.day-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.day-grid .day-sec{padding-top:2px}
.day-grid .panel{padding:14px 18px 12px}
.bar-r{padding:5px 8px}
.bar-n{font-size:13px}
.bar-t{height:8px} .bar-t::after{border-left-width:1px;opacity:.4}
.bar-v{font-size:12.5px;font-weight:500}
@media (max-width:1000px){.day-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.rw{grid-template-columns:62px minmax(0,1fr)}.rw-lead{font-size:12.5px;align-self:start;padding-top:2px}.rw-meta,.rw-act{grid-column:2}.rw-act{justify-content:flex-start}.rw-main b,.rw-main small{white-space:normal}}

/* Aufbau: Liste */
.au-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:-4px 0 18px;font-size:13.5px;color:var(--muted)}
.au-sum b{color:var(--fg);font-weight:600}
.au-m{display:block;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;width:100%}
.au-m i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.au-m.big{width:200px;flex:none}
.au-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.au-row{display:grid;grid-template-columns:32px minmax(0,1.5fr) minmax(220px,1fr) auto;gap:8px 20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.au-n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-strong);font:600 13px var(--f-display);color:var(--muted);background:var(--surface)}
.au-n .ico{width:15px;height:15px;stroke-width:2.6}
.au-row.done .au-n{background:var(--good);border-color:var(--good);color:var(--surface)}
.au-row.active .au-n{border-color:var(--gold);color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.au-row.done .au-t b,.au-row.done .au-t small{color:var(--muted)}
.au-t{min-width:0}
.au-t b{display:block;font:600 16px/1.25 var(--f-display);letter-spacing:.01em}
.au-t b em{font:600 11px var(--f-body);font-style:normal;color:var(--accent);margin-left:8px;letter-spacing:.01em}
.au-t small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4;text-wrap:pretty}
.au-p{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted);min-width:0}
.au-p > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au-row.done .au-m i{background:var(--good)}
.au-a .btn{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:30px}
@media (max-width:1000px){.au-row{grid-template-columns:32px minmax(0,1fr)}.au-p,.au-a{grid-column:2}.au-a .btn{max-width:none}}
.au-mini .gring{display:none}

/* Listen: ruhige Zustände, Aktionen beim Zeigen, feste Kopfzeile */
.lt-st span{background:transparent;padding:0;color:var(--muted);font-weight:500;font-size:12px}
.lt-st span.open{display:inline-flex;align-items:center;gap:5px}
.lt-st span.open i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint);display:inline-block}
.lt-st span.top{color:var(--gold);font-size:13px}
.lt-st span.ok{background:transparent;color:var(--muted)}
.lt-st{gap:10px}
.st-ref{font-size:12.5px;font-style:italic;color:var(--muted)}
.lt-fc i{width:7px;height:7px}
.lt-fc.good i,.lt-fc.warn i{background:var(--faint)}
.lt-fc.bad i{background:var(--bad)}
.lt-fc.warn{color:var(--fg)}
table.lt .lt-acts,table.stock td.nowrap .icon-btn{opacity:0;transition:opacity .12s}
table.lt tr:hover .lt-acts,table.lt tr:focus-within .lt-acts,table.stock tr:hover td.nowrap .icon-btn,table.stock tr:focus-within td.nowrap .icon-btn{opacity:1}
@media (hover:none){table.lt .lt-acts,table.stock td.nowrap .icon-btn{opacity:1}}
table.lt td{height:46px}
table.lt th{font-size:10.5px;letter-spacing:.07em;padding:8px 12px;background:var(--surface);color:var(--faint)}
table.lt tr.grp td{top:33px}
.lt-n b{font-weight:500}
.lt-n small{font-size:12px}
table.lt tbody tr.row:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
table.stock tbody tr.row{cursor:pointer} table.stock tbody tr.row:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
table.stock tr.is-low td{background:transparent}
table.stock tr.is-low td:first-child{box-shadow:inset 2px 0 0 var(--warn)}
input.num-in{text-align:right;font-variant-numeric:tabular-nums}
.lt-price{width:80px;padding:0 6px!important;min-height:30px!important;border-color:transparent;background:transparent;font-weight:500;color:var(--fg);border-radius:4px}
.lt-price:hover{border-color:var(--line-strong);background:var(--surface)}
.lt-price:focus{border-color:var(--accent);background:var(--surface);font-weight:600}
table.lt tbody tr.row:hover .lt-price{border-color:var(--line-strong)}
.lt-wrap{border-radius:var(--r)}
@media (min-width:1000px){
  .lt-wrap{overflow:clip}
  .lt-n small{max-width:40ch}
  table.lt td.hide-m.lt-muted{white-space:normal}
  table.lt th{top:0}
  #app[data-view="stock"] .panel.flush:has(table.stock){overflow:visible}
  table.stock thead th{position:sticky;top:0;z-index:2;background:var(--surface)}
  table.stock thead th:first-child{border-top-left-radius:var(--r)} table.stock thead th:last-child{border-top-right-radius:var(--r)}
}
th{background:var(--surface);color:var(--faint);font-size:10.5px;letter-spacing:.07em;border-bottom:1px solid var(--line)}
tfoot td{background:transparent;border-top:1px solid var(--line-strong)}
.vb.warn{background:transparent;color:var(--muted);font-weight:500;font-style:italic;padding:0}
.cnt{background:transparent;color:var(--muted);font-weight:500;font-size:13px;min-width:0;padding:0} .cnt.zero{color:var(--faint)}
.lvl{height:6px}
.lvl i.good{background:var(--faint)} .lvl i.warn{background:var(--warn)}

/* Hinweiskästen: nur noch für seltene, echte Probleme */
.warn-box{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:var(--r-s)}
.warn-box .ico{color:var(--warn)}
.ok-box{background:transparent;color:var(--good);padding:0;font-weight:500}
.g-closed{border-radius:var(--r-s)}

/* Einkauf, Lieferanten, Auswertung */
#app[data-view="stock"] .tile .t-v.bad-t,#app[data-view="buy"] .tile .t-v.bad-t{color:inherit}
.oc .btn.primary{background:var(--surface);border-color:var(--line);color:var(--fg)} .oc .btn.primary:hover{border-color:var(--muted);opacity:1}
.oc .btn .ico{display:none}
#app.v-list .oc.urgent{box-shadow:inset 2px 0 0 var(--bad)!important}
.oc h3,.lo-h b{font:600 15px/1.2 var(--f-display);letter-spacing:.01em}
.cd{font-weight:500}
.ost{font-weight:600;font-size:11px}
.rp-label b{font-size:22px}
.legend{font-size:12px}
.rp-chart .bar{fill:var(--gold)}
.rp-matrix .ql{font-weight:500}
.sp-card h3{font:600 16px/1.2 var(--f-display)}

/* Dialog, Palette, Einstellungen */
dialog h3{font:500 22px var(--f-display);letter-spacing:.01em}
.pg{font-size:11px;font-weight:500}
.who-b,.sw-preset,.orn-b,.algc span{border-radius:var(--r-s)}
.algc input:checked + span{background:var(--surface-2);border-color:var(--fg)}
.au-mini>div b{font-weight:600}
.rw-box{border-radius:var(--r)}

/* Seitenleiste */
.brand b{font-weight:400}
.nav-i{font-weight:500}
.kbd-btn kbd{font-family:var(--f-body)}

/* Gästekarte-Werkzeuge: Reiter als Segment behalten, nichts in Versalien */
.guest-tools .f{font-weight:500}

/* Dunkel: Kontraste nachziehen */
:root[data-theme="dark"] .au-row.done .au-n{color:#16130d}
:root[data-theme="dark"] .h-n{color:var(--faint)}
:root[data-theme="dark"] .lt-price:hover,:root[data-theme="dark"] .lt-price:focus{background:var(--surface-2)}
:root[data-theme="dark"] .au-m{background:var(--line)}
:root[data-theme="dark"] .pc-ex{background:var(--surface-2)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .au-row.done .au-n{color:#16130d}
  :root:not([data-theme="light"]) .lt-price:hover,:root:not([data-theme="light"]) .lt-price:focus{background:var(--surface-2)}
  :root:not([data-theme="light"]) .au-m{background:var(--line)}
}

/* Handy */
@media (max-width:900px){
  .page-h h1{font-size:28px}
  .h-n{font-size:17px}
  .page-h .sub{font-size:13px}
  .day{gap:20px}
  .toolbar.filters .seg{max-width:100%;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .sel-cat{flex:1 1 100%;max-width:none}
  .au-sum .au-m.big{width:100%}
}
@media (max-width:760px){
  table.lt tr.grp td{top:0}
}
@media (max-width:700px){#app[data-view="dash"] .day .tiles{display:grid!important;grid-template-columns:1fr 1fr!important;overflow:visible!important}#app[data-view="dash"] .day .tiles .tile{min-width:0!important}}
@media (max-width:700px){#app[data-view="dash"] .day .tiles .tile:nth-child(odd){border-left:0!important;box-shadow:none!important}}
html{scrollbar-gutter:stable}

/* =====================================================================
   Hauskarte „Schiefer & Blattl“ – Gästekarte in A4-Blättern (794 × 1123 px)
   Schiefer, Gold und Kreidetafel + Kapitelziffern und Tisch von oben.
   Nur Eigenschaften, die html2canvas sauber rendert (kein filter, blend,
   columns, text-transform, object-fit). Texturen/Duoton kommen aus dem Canvas.
   ===================================================================== */
.hs-page{
  --gold:#C59C69; --gold2:#e4cb9f; --gold-d:rgba(197,156,105,.55); --gold-f:rgba(197,156,105,.3);
  --cream:#f3ecdf; --cream2:#d3ccbd; --paper:#f3ede1; --ink:#1f2328; --ink2:#4a5057; --ink3:#767b82;
  --ac:#a9c3d6; --ac-ink:#557890;
  --ft:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --fs:"Fraunces",Georgia,serif; --fh:"Caveat","Segoe Script",cursive;
  position:relative; width:794px; height:1123px; overflow:hidden; box-sizing:border-box; flex:none;
  background:#1b1e23 url("brand/slate.webp") center/cover no-repeat; background-image:var(--hs-slate, url("brand/slate.webp"));
  color:var(--cream); font:400 14px/1.4 var(--fs); text-align:left; -webkit-font-smoothing:antialiased; font-kerning:normal;
  font-variant-numeric:lining-nums; letter-spacing:0; hyphens:manual; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.hs-page *{box-sizing:border-box}
.hs-page p,.hs-page h1,.hs-page h2,.hs-page h3,.hs-page figure{margin:0;padding:0;border:0;background:none}
.hs-page h1,.hs-page h2,.hs-page h3{font-weight:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
.hs-page img,.hs-page svg{display:block;max-width:none}
.hs-page.wood{background-color:#3b2a1c;background-image:var(--hs-wood, url("brand/table.webp"))}
.hs-frame{position:absolute;left:22px;top:22px;right:22px;bottom:22px;border:1px solid var(--gold-f);pointer-events:none}

/* Kopf- und Fußzeile */
.hs-ph{position:absolute;left:53px;right:53px;top:42px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:300 12.5px/1 var(--ft);letter-spacing:.3em;color:var(--gold)}
.hs-ph b{font-weight:500}
.hs-ph .rr{display:flex;align-items:center;gap:8px;font-weight:400;font-size:12px;letter-spacing:.24em}
.hs-pf{position:absolute;left:53px;right:53px;bottom:38px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:400 10.5px/1.2 var(--ft);letter-spacing:.16em;color:var(--gold)}
.hs-pf .n{font:300 15px/1 var(--fs);letter-spacing:.02em;color:var(--gold2)}
.hs-body{position:absolute;left:53px;right:53px;top:84px;bottom:70px;display:flex;flex-direction:column;overflow:hidden}

/* Zonen: direkt auf Schiefer oder als Papierbogen */
.hs-zone{flex:none;position:relative}
.hs-zone + .hs-zone{margin-top:30px}
.hs-zone.paper{margin-left:-21px;margin-right:-21px;padding:34px 40px 32px;background:var(--paper);color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.hs-zone.paper .hs-inl{position:absolute;left:0;top:11px;right:0;bottom:11px;border-top:1px solid var(--gold-d);border-bottom:1px solid var(--gold-d);pointer-events:none}
.hs-zone.grow{flex:1 1 auto}
.hs-zone > .hs-sec{position:relative}
.hs-sec + .hs-sec{margin-top:34px}
.hs-zone.slate + .hs-zone.paper{margin-top:36px}
.hs-fill{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.hs-zone.paper .hs-fill{left:30px;right:30px;bottom:26px;opacity:.55}

/* Kapitelkopf */
.hs-sh{display:flex;align-items:flex-end;gap:20px;padding-bottom:13px;border-bottom:1px solid var(--gold-d);margin-bottom:16px}
.hs-num{flex:none;font:300 84px/.74 var(--fs);letter-spacing:-.04em;color:var(--gold);padding-bottom:3px;min-width:92px}
.paper .hs-num{color:var(--ink)}
.hs-sh .tt{flex:1;min-width:0}
.hs-title{font:300 31px/1 var(--ft);letter-spacing:.15em;color:var(--gold2)}
.paper .hs-title{color:var(--ink)}
.hs-intro{margin-top:7px!important;font:italic 400 14.5px/1.35 var(--fs);color:var(--cream2)}
.paper .hs-intro{color:var(--ink2)}
.hs-sh .ill{flex:none;width:58px;height:58px;margin-bottom:-2px}
.hs-cont{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:1px solid var(--gold-d);margin-bottom:14px;font:300 20px/1 var(--ft);letter-spacing:.15em;color:var(--gold2)}
.paper .hs-cont{color:var(--ink)}
.hs-cont i{font:italic 400 13px/1 var(--fs);letter-spacing:0;color:var(--cream2)}
.paper .hs-cont i{color:var(--ink2)}
.hs-cont .hs-num{font-size:34px;min-width:0;padding:0}

/* Gericht (Liste) */
.hs-grid{display:grid;grid-template-columns:1fr;gap:12px 36px;align-items:start}
.hs-grid.c2{grid-template-columns:1fr 1fr}
.hs-d{min-width:0}
.hs-l{display:flex;align-items:baseline;gap:8px}
.hs-n{font:500 18.5px/1.15 var(--ft);letter-spacing:.012em;color:var(--cream)}
.paper .hs-n{color:var(--ink)}
.hs-lead{flex:1;min-width:14px;height:1px;border-bottom:1px dotted var(--gold-d);position:relative;top:-4px}
.paper .hs-lead{border-bottom-color:rgba(31,35,40,.4)}
.hs-p{font:500 18.5px/1 var(--ft);color:var(--gold2);white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
.paper .hs-p{color:var(--ink)}
.hs-p small{font:400 12px/1 var(--ft);letter-spacing:.05em;color:var(--cream2);margin-right:7px}
.paper .hs-p small{color:var(--ink2)}
.hs-ps{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hs-ds{margin-top:2px!important;font:400 13px/1.36 var(--fs);color:var(--cream2);padding-right:14px}
.paper .hs-ds{color:var(--ink2)}
.hs-al{font:400 10px/1 var(--ft);letter-spacing:.2em;color:var(--gold);white-space:nowrap;margin-left:7px}
.paper .hs-al{color:var(--ink3)}
.hs-veg{display:inline-block;margin-left:6px;position:relative;top:-2px;font:500 9.5px/1 var(--ft);letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold-d);border-radius:9px;padding:2px 5px 2px;white-space:nowrap}
.paper .hs-veg{color:var(--ac-ink);border-color:var(--ac-ink)}
.hs-gl{display:inline-block;vertical-align:-1px;margin-right:5px}

/* Empfehlung: Goldrahmen */
.hs-feat{position:relative;margin:12px 0 20px;padding:17px 22px 15px;border:1px solid var(--gold);background:rgba(197,156,105,.07);display:flex;gap:24px;align-items:flex-start;justify-content:space-between}

.hs-emb{position:relative;overflow:hidden;width:78px;height:78px}

.hs-back .addr{margin-top:14px!important;font:400 11.5px/1.75 var(--ft);letter-spacing:.24em;color:var(--gold)}

.hs-leg{flex:none;align-self:stretch;text-align:left;padding-top:18px;border-top:1px solid var(--gold-f)}

/* ---------- Vorschau in der App ---------- */
.hs-measure{position:absolute;left:-12000px;top:0;width:794px;visibility:hidden;pointer-events:none;contain:layout style}
.hs-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hs-bar .hs-count{font-size:13px;color:var(--muted);font-weight:600}
.hs-prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.hs-prev.one{grid-template-columns:minmax(0,794px);justify-content:center}
.hs-sheet{position:relative;width:100%;aspect-ratio:794/1123;overflow:hidden;background:#1b1e23;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.22)}
.hs-sheet > .hs-page{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--hs-s,.4))}
.hs-sheet .hs-no{position:absolute;right:6px;top:6px;z-index:2;font:600 10px/1 var(--f-body,system-ui);color:#fff;background:rgba(0,0,0,.45);border-radius:9px;padding:3px 7px}
@media (max-width:700px){.hs-prev,.hs-prev.one{grid-template-columns:minmax(0,1fr);gap:12px}.hs-bar .seg{display:none}}
.hs-copy{display:flex;flex-direction:column;gap:10px}
.hs-copy textarea{min-height:0;height:74px;font-size:14px;line-height:1.45;resize:vertical}
.hs-copy details{border-top:1px solid var(--line);padding-top:8px}
.hs-copy summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:2px 0}
.hs-copy details .f{margin-top:8px}
.hs-copy .f input{font-size:14px}

/* ---------- PDF / Druck ---------- */
#print.pdf.hs-print{padding:0;width:794px;background:#1b1e23}
#print.hs-print .hs-page{margin:0}
@page hauskarte{size:A4;margin:0}
@media print{
  body.print-menu .hs-print{background:none}
  body.print-menu .hs-print .hs-page{page:hauskarte;width:793px;height:1122px;break-after:page;page-break-after:always;break-inside:avoid}
  body.print-menu .hs-print .hs-page:last-child{break-after:auto;page-break-after:auto}
}

.hs-emb2{width:84px;height:84px}

.hs-cols{display:flex;gap:36px;align-items:flex-start}
.hs-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:13px}
.hs-spread{display:flex;flex-direction:column}

.hs-spread .hs-grid > .hs-d:last-child{border-bottom:0}

/* =====================================================================
   Audit-Korrekturen: neue Bausteine, Kontrast, Telefon-Layout, Tippflächen
   ===================================================================== */
/* ---------- Bausteine ---------- */
#toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 18px}
.toast-act{border:0;border-radius:999px;background:var(--bg);color:var(--fg);font:600 13.5px var(--f-body);padding:8px 14px;cursor:pointer;white-space:nowrap}
.toast-act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input.bad-in,.qty input.bad-in{outline:2px solid var(--bad);outline-offset:1px;border-color:var(--bad)}
.f-err{display:block;margin-top:6px;font:500 13px/1.4 var(--f-body);color:var(--bad)}
.dlg-warn{margin:12px 0 0;align-items:flex-start}
.dlg-warn .btn{flex:none;margin-left:auto}
.demo-ask{border:1px solid var(--line);border-radius:var(--r-s,8px);padding:10px 14px 12px;margin:14px 0 0;min-width:0}
.demo-ask legend{font:600 12.5px var(--f-body);color:var(--muted);padding:0 6px}
.demo-ask .dlg-p{margin:0 0 8px}
.ro-note{display:flex;gap:10px;align-items:center;margin:0 0 16px;padding:9px 14px;border:1px solid var(--line-strong);border-radius:var(--r-s,8px);background:var(--surface-2);font-size:13.5px;color:var(--fg)}
.ro-note .ico{width:18px;height:18px;flex:none;color:var(--muted)}
.ro[disabled],.ro[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
input.ro[disabled],textarea.ro[disabled],select.ro[disabled]{opacity:.8;background:transparent}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:saturate(.4);box-shadow:none}
.btn.primary:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong);opacity:1}
.row-open{all:unset;cursor:pointer;display:inline;max-width:100%;border-radius:4px}
.row-open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row-open:disabled{cursor:default}
.safety{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.safety small{display:block;font-size:12.5px}
.who-can{display:block;font-size:11.5px!important;line-height:1.3}
.moves li.mv-grp{align-items:start}
.mv-det summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:2px 0}
.mv-det ul{list-style:none;margin:6px 0 2px;padding:0;display:grid;gap:3px;font-size:12.5px}
.mv-det li{display:flex!important;justify-content:space-between;gap:12px;padding:0!important;border:0!important}
.tot-l{font:500 11.5px var(--f-body);color:var(--muted);margin-right:2px}
.otab .dev{display:block;font:500 11.5px var(--f-body);color:var(--muted);white-space:nowrap}
.otab .dev.bad-t{color:var(--bad)} .otab .dev.good-t{color:var(--good)}
.otab .rc-sum{display:block;font:400 12px var(--f-body)}
.otab tfoot .tf-l{font-size:12px}
.pc-msg{display:block;margin-top:8px;font:500 13.5px/1.45 var(--f-body);color:var(--bad)}
.pc-msg .btn{margin-left:8px;vertical-align:baseline}
.lab-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.lab-pick .muted{flex-basis:100%}
.lab-pick .lab-new{border-style:dashed}
.lab-ing.free{border-style:dashed}
.lab-ing.free small{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;color:var(--warn,#9a6200);margin-left:6px}
.lab-hint{margin:8px 0 0}
.rw.rw-fold{display:block;padding-top:8px;padding-bottom:8px}
.rw-more{border:0;background:none;padding:6px 0;font:500 13px var(--f-body);color:var(--muted);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.rw-more:hover{color:var(--fg)} .rw-more:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.plist .exact{font:400 11.5px var(--f-body);margin-left:6px}
.oc.done .cd{color:var(--good)}

/* ---------- Saison-Zeitleiste: nichts überdeckt sich ---------- */
.tl-track{margin-top:20px}
.tl-months span{padding-bottom:4px}
.tl-today::after{top:-17px;font-size:10px;background:var(--fg);color:var(--bg);padding:1px 5px;border-radius:3px;line-height:1.3;white-space:nowrap}
.tl-today.r::after{left:auto;right:-2px;transform:none} .tl-today.l::after{left:-2px;transform:none}
.tl-pin{flex-direction:row;align-items:center;gap:6px;max-width:none;height:24px}
.tl-pin:nth-child(even){top:auto}
.tl-pin i{flex:none}
.tl-pin span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px}
.tl-pin.r{flex-direction:row-reverse;transform:translateX(-100%)}
.tl-track{margin-top:26px}

/* ---------- Kontrast im hellen Design: gedämpfter Text bleibt lesbar ---------- */
:root{--muted:#5d6164;--faint:#70757a}
/* dunkles Design: Werte aus ui3.css gelten weiter (höhere Spezifität) */
/* „vorbei“ wird über die Farbe leiser, nicht über Durchsichtigkeit (die drückt den Kontrast unter die Grenze) */
.rw.past,.oc.past,.sp-card.past{opacity:1}
.rw.past .rw-lead,.rw.past .rw-main b,.oc.past h3{color:var(--muted);font-weight:500}
.rw.past .rw-main small,.rw.past .rw-meta{color:var(--muted)}
.sp-card.past h3{color:var(--muted)}
.st-ref,.ti-flag{color:var(--muted)}

/* ---------- Listen: Kopf und Gruppenzeile schließen bündig, keine Zeilenreste dazwischen ---------- */
table.lt thead th{height:35px;box-sizing:border-box;padding-top:0;padding-bottom:0}
table.lt tr.grp td{top:34px}
@media (min-width:1000px){
  /* Auswertung: Tabelle passt immer in die Breite, statt rechts abgeschnitten zu werden */
  table.lt.rp-items{min-width:0}
  table.lt.rp-items th,table.lt.rp-items td{padding-left:9px;padding-right:9px}
  table.lt.rp-items th:first-child,table.lt.rp-items td:first-child{padding-left:14px}
  table.lt.rp-items .lt-n b{white-space:normal}
}
@media (min-width:1000px) and (max-width:1420px){table.lt.rp-items .c-x1{display:none}}
@media (min-width:1000px) and (max-width:1180px){table.lt.rp-items .c-x2{display:none}}
.lt-wrap:has(> table.rp-items){overflow-x:auto}
@media (min-width:1000px){.lt-wrap:has(> table.rp-items){overflow:clip}}
.rp-matrix .pt text{font-size:10.5px}
.rp-cmpnote{margin-top:-6px}

/* ---------- Einkauf ---------- */
#app.v-list .oc{grid-template-columns:minmax(130px,1fr) minmax(140px,1.4fr) 136px 96px 142px minmax(0,max-content)}
#app.v-list .oc .row-btns{flex-wrap:wrap;min-width:0;gap:6px}
.oc .row-btns{flex-wrap:wrap}
table.otab input.num-in{width:84px;text-align:right;padding:6px 8px}
table.otab td:first-child small{white-space:nowrap}
table.otab td[data-l="Menge"] .qty{display:inline-grid;grid-template-columns:84px 124px;gap:8px;align-items:center;text-align:left}
table.otab td[data-l="Menge"] .qty em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.otab td.ol-x{width:42px;text-align:right}
table.recv td[data-l="Preis lt. Rechnung"] .qty{display:inline-grid;grid-template-columns:84px 58px;gap:8px;align-items:center;text-align:left}
.ol-tot{white-space:nowrap}

/* ---------- Einstellungen: Karten ohne Löcher (Spaltenfluss statt Raster) ---------- */
.setup-grid{display:block;columns:2 400px;column-gap:18px}
.setup-grid > .panel{break-inside:avoid;margin:0 0 18px;display:block;width:100%}

/* ---------- Telefon ---------- */
@media (max-width:700px){
  /* Kennzahlen als Raster, kein verstecktes Wischen zur Seite */
  .tiles{display:grid!important;grid-template-columns:1fr 1fr!important;overflow:visible!important}
  .tiles .tile{min-width:0!important;border-left:0!important;box-shadow:none!important;border-top:1px solid var(--line)}
  .tiles .tile:nth-child(-n+2){border-top:0}
  .tiles .tile:nth-child(even){border-left:1px solid var(--line)!important}
  .tiles .tile:last-child:nth-child(odd){grid-column:1/-1}
  .tiles .t-v{font-size:22px;overflow-wrap:anywhere}
  /* Bestellung und Wareneingang: jede Position eine Karte, alle Werte sichtbar */
  .tbl-wrap:has(> table.otab){overflow:visible}
  table.otab{min-width:0;display:block}
  table.otab thead{display:none}
  table.otab tbody,table.otab tfoot{display:block}
  table.otab tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:12px 16px;border-top:1px solid var(--line)}
  table.otab tbody tr:first-child{border-top:0}
  table.otab td{display:block;padding:0!important;border:0!important;height:auto;text-align:left!important;min-width:0}
  table.otab td:empty,table.otab td.ol-x:not(:has(button)){display:none}
  table.otab td[data-l="Artikel"]{grid-column:1/-1}
  table.otab td[data-l]:not([data-l="Artikel"])::before{content:attr(data-l);display:block;font:500 11.5px var(--f-body);color:var(--muted);margin-bottom:2px}
  table.otab td[data-l="Menge"]{grid-column:1/-1}
  table.otab td[data-l="Menge"] .qty{grid-template-columns:110px minmax(0,1fr)}
  table.otab input.num-in{width:110px;min-height:44px;font-size:16px}
  table.otab td.ol-x{position:absolute;right:10px;margin-top:-4px;width:auto}
  table.otab tr{position:relative}
  table.otab td:first-child small{white-space:normal}
  table.otab tfoot td[colspan]{grid-column:1/-1;font-weight:600}
  table.otab tfoot .tf-l{display:none}
  table.recv td[data-l="Bestellt"]{grid-column:1/-1}
  table.recv td[data-l="Status"]{grid-column:1/-1}
  table.recv select{width:100%;min-height:44px}
  table.recv td[data-l="Preis lt. Rechnung"] .qty{grid-template-columns:110px minmax(0,1fr)}
  .recv-f{flex-direction:column;align-items:stretch}
  .recv-f .f{min-width:0}
  /* Auswertung: Kopf in ein bis zwei Zeilen */
  .rp-period{gap:8px;padding:12px}
  .rp-units .seg{display:flex;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .rp-units .seg button{flex:none}
  .rp-nav{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;align-items:center}
  .rp-nav .f{grid-column:1/-1;flex:none}
  .rp-nav > .sp,.rp-nav > .muted.sm{display:none}
  .rp-nav > [data-act="rpToday"]{grid-column:1/3;grid-row:auto;justify-self:start}
  .rp-nav > .seg{grid-column:2/-1;justify-self:end;margin-top:-48px}
  .rp-label{min-width:0}
  .rp-label b{font-size:18px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-label small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
  .lt-wrap:has(> table.rp-items){overflow:visible}
  table.lt.rp-items{min-width:0;table-layout:auto}
  table.lt.rp-items th,table.lt.rp-items td{padding-left:8px;padding-right:8px}
  table.lt.rp-items th:nth-child(8),table.lt.rp-items td:nth-child(8):not([colspan]){display:none}
  table.lt.rp-items .lt-n b{white-space:normal;overflow-wrap:anywhere}
  table.lt.rp-items .rp-d{font-size:11.5px}
  .page-h .sub{font-size:13px}
  .setup-grid{columns:1}
}
@media (max-width:420px){table.lt.rp-items td.rp-net{font-size:13px}}

/* ---------- Tippflächen: mindestens 40 px auf Touch-Geräten, Desktop bleibt dicht ---------- */
@media (pointer:coarse), (max-width:700px){
  .seg{height:auto;min-height:46px}
  .seg button{height:auto;min-height:40px;min-width:40px;padding-left:12px;padding-right:12px}
  .chip{height:auto;min-height:40px;padding-left:12px;padding-right:12px}
  .btn.sm{min-height:40px;padding-left:12px;padding-right:12px}
  .vsw{height:auto} .vsw button{width:42px;height:40px}
  .icon-btn,.lt-acts .icon-btn,.lay-acts .icon-btn,.lay-list .icon-btn{min-width:40px;min-height:40px}
  .ti-x{width:40px;height:40px;margin:-10px -12px -6px 0}
  .ti-grip{width:40px;height:40px;margin:-10px -6px -6px -14px}
  .wozu-q{width:40px;height:40px;margin:-8px -6px}
  table.lt th button,table.stock th button{min-height:40px;min-width:40px}
  table.lt thead th{height:44px}
  table.lt tr.grp td{top:43px}
  .lt-price{min-height:40px!important;font-size:16px}
  .qty input.num-in,input.num-in{min-height:40px}
  .toast-act{min-height:40px}
  .rw-more{min-height:40px}
  .row-open{display:inline-block;min-height:40px;line-height:40px}
  .lt-n .row-open{line-height:1.3;padding:10px 0;min-height:0}
  .who-b{min-height:44px}
  .link-btn,.link{min-height:40px;display:inline-flex;align-items:center}
  .mv-det summary{min-height:40px;display:flex;align-items:center}
  .lab-ing button{min-width:40px;min-height:40px}
  .back{min-height:40px}
}
.row-open{display:block;width:fit-content}
.f > input.num-in,.dlg-p + .f input.num-in{text-align:left}
.seg button small{opacity:1;color:var(--muted)}
.seg button.on small{color:var(--muted)}
.sh-chip small{opacity:1;color:var(--muted)}
@media (pointer:coarse), (max-width:700px){
  .lt-n .row-open{padding:11px 0;min-width:40px}
  .row-open{min-width:40px}
}
.sh-chip.used{opacity:1;background:var(--surface-2);border-style:dashed}
.sh-chip.used b{color:var(--muted);font-weight:500}

/* ===================== Begleitung: Rundgang, Hilfe, Aufgaben, Einfach-Modus ===================== */
/* Maßstab wie im Feinschliff: Radien 6/8, eine Linie statt Kasten, Gold nur als Markierung */

/* ---------- Rundgang: Lichtkegel und Karte ---------- */
.gd{position:fixed;inset:0;z-index:400;pointer-events:none}
.gd-b{position:fixed;pointer-events:auto;background:transparent}
.gd-hole{position:fixed;border-radius:8px;box-shadow:0 0 0 200vmax rgba(22,24,26,.58);outline:2px solid var(--gold);pointer-events:none}
.gd-hole.none{outline:0;border-radius:0}
.gd-hole.off{display:none}
.gd-hole.open{animation:gdPulse 1.8s ease-in-out infinite}
.gd-ok .gd-hole{outline-color:var(--good);animation:none}
@keyframes gdPulse{0%,100%{outline-offset:0}50%{outline-offset:4px}}
.gd-move .gd-hole{transition:left .32s cubic-bezier(.2,.8,.2,1),top .32s cubic-bezier(.2,.8,.2,1),width .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1)}
.gd-move .gd-card{transition:left .32s cubic-bezier(.2,.8,.2,1),top .32s cubic-bezier(.2,.8,.2,1)}
.gd-card{position:fixed;left:12px;top:12px;pointer-events:auto;box-sizing:border-box;width:min(348px,calc(100vw - 24px));background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 20px 48px -14px rgba(0,0,0,.5);padding:14px 16px 12px;font-family:var(--f-body);outline:0}
.gd-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.gd-n{margin-left:auto;font-variant-numeric:tabular-nums}
.gd-mark{width:18px;height:18px;flex:none;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gd-mark .post{stroke:currentColor}
.gd-mark .board{stroke:var(--gold);fill:color-mix(in srgb,var(--gold) 26%,transparent)}
.gd-card h3{font:500 23px/1.15 var(--f-display);letter-spacing:.005em;margin:8px 0 5px}
.gd-card p{margin:0;font-size:14.5px;line-height:1.5;text-wrap:pretty}
.gd-card .gd-do{display:flex;gap:9px;align-items:flex-start;margin-top:10px;padding:9px 11px;border-radius:6px;background:color-mix(in srgb,var(--gold) 15%,var(--surface));font-weight:600;font-size:14px;line-height:1.4}
.gd-tap,.gd-okm{width:20px;height:20px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gd-card.ok .gd-do{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.gd-okm{stroke:var(--good);stroke-width:2.6;stroke-dasharray:24;stroke-dashoffset:24;animation:gdDraw .45s ease-out .05s forwards}
@keyframes gdDraw{to{stroke-dashoffset:0}}
.gd-card .gd-ro{margin-top:8px;font-size:13px;color:var(--muted)}
.gd-f{display:flex;align-items:center;gap:8px;margin-top:14px}
.gd-skip{border:0;background:none;padding:0;min-height:36px;color:var(--muted);font:500 13px var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.gd-skip:hover{color:var(--fg)}
.gd-dots{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}

.gd-bar{height:2px;background:var(--line);border-radius:1px;margin-top:9px;overflow:hidden}
.gd-bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.gd-dots i{width:5px;height:5px;border-radius:50%;background:var(--line-strong);flex:none}
.gd-dots i.d{background:var(--gold)}
.gd-dots i.on{background:var(--fg);transform:scale(1.25)}
.gd-card .btn.sm{min-height:36px;padding:0 14px}
.gd-card.nudge{animation:gdNudge .32s ease-out}
@keyframes gdNudge{0%,100%{transform:none}30%{transform:translateY(-4px)}60%{transform:translateY(2px)}}
.gd.docked .gd-card{box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.gd-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:root[data-theme="dark"] .gd-hole{box-shadow:0 0 0 200vmax rgba(0,0,0,.66)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gd-hole{box-shadow:0 0 0 200vmax rgba(0,0,0,.66)}}
@media (max-width:900px){.gd-card .btn.sm,.gd-skip{min-height:40px}.gd-card h3{font-size:21px}}
@media (prefers-reduced-motion:reduce){.gd-move .gd-hole,.gd-move .gd-card{transition:none}.gd-hole.open,.gd-card.nudge{animation:none}.gd-okm{animation:none;stroke-dashoffset:0}}

/* ---------- Fragezeichen am Titel, Brotkrumen ---------- */
.wozu-q{cursor:pointer}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:10px}
.crumb .back{margin-bottom:0;flex:none}
.crumb-sep{color:var(--muted)}
.crumb-here{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);font-weight:600;font-size:14px}
.crumb .sp{flex:1}
.crumb-q{display:inline-flex;align-items:center;gap:6px;flex:none;border:0;background:none;padding:0 2px;min-height:36px;color:var(--muted);font:500 13px var(--f-body);cursor:pointer}
.crumb-q .ico{width:16px;height:16px}
.crumb-q:hover{color:var(--fg)}
@media (max-width:900px){.crumb-q{min-height:40px;min-width:40px;justify-content:flex-end}.crumb-q span{display:none}.crumb-q .ico{width:20px;height:20px}}

/* ---------- Seitenleiste unten, Kopf am Handy ---------- */
.side-help{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--side-fg) 10%,transparent)}
.side-help + .side-foot{margin-top:0}
.side-help ~ .side-foot{margin-top:0}
.sh-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--side-muted);padding:7px 12px;border-radius:6px;cursor:pointer;font:500 13.5px var(--f-body);text-align:left}
.sh-i:hover{background:var(--side-2);color:var(--side-fg)}
.sh-i .ico,.sh-i .gd-mark{width:18px;height:18px;flex:none}
.sh-i span{flex:1}
.sh-sw{width:26px;height:14px;border-radius:7px;background:color-mix(in srgb,var(--side-fg) 20%,transparent);position:relative;flex:none;transition:background .15s}
.sh-sw::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--side-fg);transition:transform .15s}
.sh-i[aria-pressed="true"]{color:var(--side-fg)}
.sh-i[aria-pressed="true"] .sh-sw{background:var(--gold)}
.sh-i[aria-pressed="true"] .sh-sw::after{transform:translateX(12px)}
.topbar .theme-btn[data-act="helpMode"][aria-pressed="true"]{background:var(--gold);color:#1f2326}

/* ---------- Hilfe-Modus ---------- */
body.gd-help #app,body.gd-help .side,body.gd-help .bottom,body.gd-help .topbar{cursor:help}
body.gd-help #app *,body.gd-help .side *,body.gd-help .bottom *,body.gd-help .topbar *{cursor:help}
@media (hover:hover){body.gd-help [data-help]:hover{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}}
.gd-helpbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:130;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);box-sizing:border-box;background:var(--side);color:var(--side-fg);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:8px;padding:6px 6px 6px 12px;font-size:13.5px;line-height:1.35;box-shadow:var(--float)}
.gd-helpbar .ico{width:18px;height:18px;flex:none;color:var(--gold)}
.gd-helpbar b{font-weight:600}
.gd-helpbar .btn{flex:none;min-height:34px;background:transparent;color:var(--side-fg);border-color:color-mix(in srgb,var(--side-fg) 28%,transparent)}
.gd-bub{position:fixed;left:10px;top:10px;z-index:410;box-sizing:border-box;width:max-content;max-width:min(320px,calc(100vw - 20px));background:var(--side);color:var(--side-fg);border-radius:8px;padding:10px 12px 11px;font-size:13.5px;line-height:1.45;box-shadow:0 14px 36px -12px rgba(0,0,0,.55);opacity:0;transition:opacity .14s}
.gd-bub.in{opacity:1}
.gd-bub{border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.gd-bub::before{border-left:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-top:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.gd-bub.up::before{border:0;border-right:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-bottom:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.gd-bub.side::before{border:0;border-left:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-bottom:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.gd-bub b{display:block;font:500 17px/1.2 var(--f-display);letter-spacing:.01em;color:var(--gold-hi,var(--gold));margin-bottom:3px}
.gd-bub p{margin:0;text-wrap:pretty}
.gd-bub small{display:block;margin-top:6px;font-size:12px;color:var(--side-muted)}
.gd-bub-l{display:inline-block;margin-top:6px;border:0;background:none;padding:0;min-height:28px;color:var(--side-fg);font:500 12.5px var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.gd-bub::before{content:"";position:absolute;width:10px;height:10px;background:var(--side);transform:rotate(45deg)}
.gd-bub.down::before{top:-6px;left:calc(var(--ax,24px) - 5px)}
.gd-bub.up::before{bottom:-6px;left:calc(var(--ax,24px) - 5px)}
.gd-bub.side::before{left:-6px;top:calc(var(--ay,20px) - 5px)}
@media (max-width:900px){.gd-helpbar{bottom:calc(74px + env(safe-area-inset-bottom,0px));width:calc(100vw - 24px)}.gd-helpbar span{flex:1}.gd-helpbar .btn{min-height:40px}.gd-bub-l{min-height:40px}}

/* ---------- Erster Start ---------- */
dialog.gd-wel{width:min(560px,calc(100vw - 24px));padding:0;border-radius:10px}
.gw-in{padding:24px 24px 18px}
.gw-in > .gd-mark{width:26px;height:26px;color:var(--fg)}
.gw-in h2{font:500 30px/1.1 var(--f-display);margin:10px 0 4px;letter-spacing:.005em}
.gw-q{margin:0 0 16px;font-size:15.5px;line-height:1.5;color:var(--muted)}
.gw-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gw-o{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:8px;padding:14px 14px 16px;cursor:pointer;font-family:var(--f-body);transition:border-color .15s,background .15s}
.gw-o:hover,.gw-o:focus-visible{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--surface))}

/* ---------- Hilfsfunktionen ---------- */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fin = n => (typeof n === 'number' && isFinite(n)) ? n : 0;
const eur = n => fin(n).toLocaleString('de-AT',{style:'currency',currency:'EUR'});
const num = (n,d=0) => fin(n).toLocaleString('de-DE',{maximumFractionDigits:d});
const pct = n => (n==null || !isFinite(n)) ? '—' : num(n,1)+' %';
const byName = (a,b) => a.name.localeCompare(b.name,'de');

let S;
let view = {tab:'menu', card:null, q:'', ctype:'all', pq:''};

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function load(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }

const P = id => S.products.find(p => p.id === id);
const C = id => S.cards.find(c => c.id === id);
function refObj(ref){ if(!ref) return null; const i = ref.indexOf(':'); const t = ref.slice(0,i), id = ref.slice(i+1); const o = t==='p' ? P(id) : C(id); return o ? {t,o} : null; }
const algList = s => String(s||'').split(/[\s,]+/).filter(Boolean);

  res.missing = false;
  const q = +it.qty || 0;
  if(r.t === 'p'){
    const p = r.o; res.name = p.name;
    if(p.unit === 'Stk'){ res.unit = 'Stk'; res.cost = q * fin(+p.price); res.grossG = q * fin(+p.pieceG); }
    else { res.unit = p.unit === 'l' ? 'ml' : 'g'; res.cost = q/1000 * fin(+p.price); res.grossG = q; }
    res.netAuto = res.grossG * (1 - fin(+p.lossCold)/100);
    res.net = it.net !== '' && it.net != null ? +it.net : res.netAuto;
    res.out = res.net * (1 - fin(+p.lossHot)/100);
    algList(p.alg).forEach(a => res.alg.add(a));
  } else {
    const c = r.o; res.name = 'BR · ' + c.name; res.grossG = q;
    const t = totals(c, depth+1);
    { const y = +c.yieldG || t.out; res.cost = y ? q * t.cost / y : 0; }
    res.netAuto = q; res.net = it.net !== '' && it.net != null ? +it.net : q; res.out = res.net;
    t.alg.forEach(a => res.alg.add(a));
  }
  return res;
}
function totals(c, depth=0){
  const t = {cost:0, gross:0, net:0, out:0, alg:new Set(), lines:[]};
  if(!c || depth > 6) return t;
  for(const it of c.items){ const l = line(it, depth); t.lines.push(l); t.cost += l.cost; t.gross += l.grossG; t.net += l.net; t.out += l.out; l.alg.forEach(a => t.alg.add(a)); }
  return t;
}
function menuCalc(m){
  const c = m.card ? C(m.card) : null;
  const t = c ? totals(c) : null;
  const netPrice = (+m.price||0) / (1 + S.settings.vat/100);
  const cost = t ? t.cost : null;
  return {c, t, cost, netPrice, fc: cost!=null && netPrice ? cost/netPrice*100 : null, margin: cost!=null ? netPrice - cost : null};
}

function migrate(d){
  if(!d || typeof d !== 'object') return null;
  if(!Array.isArray(d.products) || !Array.isArray(d.cards) || !Array.isArray(d.menu)) return null;
  d.settings = Object.assign({name:'Mein Betrieb', vat:10, target:28, nextNo:d.cards.length+1}, d.settings||{});
  if(!(+d.settings.target >= 1)) d.settings.target = 28; if(!(+d.settings.vat >= 0)) d.settings.vat = 10;
  d.products = d.products.filter(p=>p && p.id); d.products.forEach(p=>{ p.name = p.name||p.id; p.unit = ['kg','l','Stk'].includes(p.unit)?p.unit:'kg'; p.price = +p.price||0; p.alg = p.alg||''; });
  d.cards = d.cards.filter(c=>c && c.id); d.cards.forEach(c=>{ c.name = c.name||'Rezeptur'; c.type = c.type==='semi'?'semi':'dish'; if(!Array.isArray(c.items)) c.items = []; c.items = c.items.filter(i=>i && typeof i==='object'); if(c.steps && !Array.isArray(c.steps)) c.steps = []; });
  d.menu = d.menu.filter(m=>m && m.id); d.menu.forEach(m=>{ m.name = m.name||'Gericht'; m.section = m.section||'Ohne Kategorie'; m.price = +m.price||0; m.desc = m.desc||''; });
  d.products.forEach(p => { if(p.stock==null){ const s = d.demo && DEMO_STOCK[p.id]; [p.stock,p.minStock,p.loc,p.supplier] = s || [0,0,'L','']; } if(p.id==='water') p.noStock = true; });
  d.cards.forEach(c => { if(!c.steps){ c.steps = splitSteps(c.method); delete c.method; } if(c.img==null) c.img=''; });
  const order = {};
  d.menu.forEach(m => { if(m.order==null){ order[m.section] = (order[m.section]||0); m.order = order[m.section]++; } if(m.img==null) m.img=''; if(m.veg==null) m.veg=''; });
  if(!d.settings.sections) d.settings.sections = [...SECTION_ORDER];

function unitOf(p){ return p ? p.unit : ''; }
function qtyFmt(q, p){ const d = p && p.unit==='Stk' ? 0 : (Math.abs(q) < 10 ? 2 : 1); return num(q, d)+' '+unitOf(p); }
function stockProducts(){ return S.products.filter(p => !p.noStock); }
function stockValue(){ return stockProducts().reduce((s,p)=>s + Math.max(0,+p.stock||0)*(+p.price||0), 0); }
function lowStock(){ return stockProducts().filter(p => (+p.minStock||0) > 0 && (+p.stock||0) < +p.minStock); }
function addMove(type, pid, delta, note='', price=null, date=null){
  const p = P(pid); if(!p || !delta) return;
  p.stock = Math.round(((+p.stock||0) + delta)*1000)/1000;
  S.moves.unshift({id:uid('mv'), date: date || new Date().toISOString(), type, pid, qty:delta, price: price ?? p.price, note});
}
function explode(c, f, acc=new Map(), d=0){
  if(!c || d > 6) return acc;
  for(const it of c.items){ const r = refObj(it.ref); if(!r) continue; const q = (+it.qty||0)*f;
    if(r.t==='p'){ if(r.o.noStock) continue; acc.set(r.o.id, (acc.get(r.o.id)||0) + (r.o.unit==='Stk' ? q : q/1000)); }
    else { const y = +r.o.yieldG || totals(r.o).out; if(y) explode(r.o, q/y, acc, d+1); } }
  return acc;
}
function orderSuggest(p){ const min = +p.minStock||0, s = +p.stock||0; let q = Math.max(0, min*2 - s); if(p.unit==='Stk') return Math.ceil(q); return Math.ceil(q*2)/2; }

function nextOrder(sec){ return S.menu.filter(m=>m.section===sec).reduce((mx,m)=>Math.max(mx, m.order??0), -1) + 1; }
function moveItem(id, dir){
  const m = S.menu.find(x=>x.id===id); const list = menuSorted().filter(x=>x.section===m.section); list.forEach((x,i)=>x.order=i);

}

function vegBadge(v){ return v==='vg' ? '<span class="vb vg" title="Vegan">VG</span>' : v==='v' ? '<span class="vb" title="Vegetarisch">V</span>' : ''; }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'}); }

/* ---------- Rahmen ---------- */
function render(){
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === view.tab));
  const app = $('#app');
  const fn = {dash:renderDash, menu:renderMenu, stock:renderStock, products:renderProducts, setup:renderSetup, buy:renderBuy, report:renderReport, aufbau:renderAufbau, pcheck:renderPriceCheck, labor:renderLabor, begriffe:renderBegriffe, stempel:renderStempel}[view.tab];
  app.innerHTML = fn ? fn() : (view.card && C(view.card) ? renderCard(C(view.card)) : renderCards());
  app.dataset.view = view.tab; app.classList.toggle('v-list', vmode('buy') !== 'cards');
  app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
  autosize();
  const wEl = $('#whoami'); if(wEl){ const u = me(); wEl.innerHTML = `<b>${esc(u.name)}</b><small>${ROLES[u.role]}${cloudReady()?' · Cloud':''}</small>`; }
  pendingRender = false;
  if(kbdSel){ const el = document.querySelector(kbdSel); kbdSel = null; if(el) el.focus({preventScroll:true}); }
}
let kbdSel = null, ptrDown = false, pendingRender = false;
function softRender(){ if(ptrDown){ pendingRender = true; return; } setTimeout(() => { const id = document.activeElement && document.activeElement.id; render(); if(id){ const n = document.getElementById(id); if(n){ n.focus({preventScroll:true}); if(n.matches('input.num-in') && n.select) n.select(); } } }, 0); }
document.addEventListener('pointerdown', () => { ptrDown = true; }, true);
document.addEventListener('pointerup', () => { ptrDown = false; if(pendingRender) setTimeout(() => { if(pendingRender){ pendingRender = false; render(); } }, 0); }, true);
document.addEventListener('click', e => { const b = e.target.closest('[data-act][data-id],[data-act]'); if(b && e.detail === 0 && b.closest('#app')) kbdSel = `[data-act="${b.dataset.act}"]` + (b.dataset.id!=null ? `[data-id="${CSS.escape(b.dataset.id)}"]` : ''); }, true);
function autosize(el){ (el ? [el] : document.querySelectorAll('#app .title-in, #app [data-step]')).forEach(t => { if(t.tagName!=='TEXTAREA') return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }); }
function navHtml(short){ return TABS.map(([k,l,s])=>`<button type="button" class="nav-i" data-tab="${k}">${ico(k)}<span>${short?s:l}</span></button>`).join(''); }

/* ---------- Übersicht ---------- */
function renderDash(){
  const all = S.menu.map(m => ({m, k:menuCalc(m)}));
  const linked = all.filter(x => x.k.cost != null).sort((a,b)=>b.k.fc-a.k.fc);
  const avg = linked.length ? linked.reduce((s,x)=>s+x.k.fc,0)/linked.length : null;
  const over = linked.filter(x => x.k.fc > S.settings.target);
  const cover = S.menu.length ? linked.length/S.menu.length*100 : 0;
  const tg = +S.settings.target;
  const scale = Math.max(40, Math.ceil(((linked[0]?.k.fc)||0)/10)*10 + 5);
  const low = lowStock();
  const drv = new Map();
  linked.forEach(x => explode(x.k.c, 1).forEach((q,pid) => { const p = P(pid); drv.set(pid, (drv.get(pid)||0) + q*(+p.price||0)); }));
  const drvList = [...drv.entries()].sort((a,b)=>b[1]-a[1]);
  const drvSum = drvList.reduce((s,x)=>s+x[1],0) || 1;
  const top = drvList.slice(0,6);
  const hour = new Date().getHours();
  const hi = hour < 11 ? 'Guten Morgen' : hour < 17 ? 'Servus' : 'Guten Abend';
  const lastInv = S.inventories[0];
  return `<div class="page-h"><div><div class="eyebrow">${new Date().toLocaleDateString('de-AT',{weekday:'long', day:'numeric', month:'long'})}</div><h1>${hi}, Küche!</h1></div>
    <div class="row-btns"><button type="button" class="btn" data-act="sales">${ico('cart')}Verkäufe buchen</button><button type="button" class="btn primary" data-act="moveDlg" data-id="in">${ico('truck')}Wareneingang</button></div></div>
  ${demoNote()}
  <div class="tiles">
    <div class="tile"><div class="tile-ring">${ring(avg,58,6)}<b>${avg==null?'—':num(avg,0)+'%'}</b></div><div><div class="t-l">Ø Wareneinsatz</div><div class="t-s">Ziel ${num(tg)} %</div></div></div>
    <div class="tile"><div><div class="t-v">${linked.length}<small>/${S.menu.length}</small></div><div class="t-l">Gerichte kalkuliert</div><div class="meter"><i style="width:${cover.toFixed(1)}%"></i></div></div></div>
    <button type="button" class="tile click" data-act="goStock" data-id="bestand"><div><div class="t-v">${eur(stockValue())}</div><div class="t-l">Lagerwert</div><div class="t-s">${lastInv?'Inventur '+fmtDate(lastInv.date):'Noch keine Inventur'}</div></div></button>
    <button type="button" class="tile click" data-act="goStock" data-id="bestellung"><div><div class="t-v ${low.length?'bad-t':'good-t'}">${low.length}</div><div class="t-l">unter Mindestbestand</div><div class="t-s">${low.length?'Bestellvorschlag ansehen →':'Lager ist gut gefüllt'}</div></div></button>
  </div>
  <div class="dash-grid">
    <section class="panel">
      <div class="panel-h"><h2>Wareneinsatz je Gericht</h2><span class="legend"><i class="tl"></i>Ziel ${num(tg)} %</span></div>
      <div class="bars" style="--tg:${(tg/scale*100).toFixed(2)}%">
        ${linked.map(({m,k})=>`<button type="button" class="bar-r" data-act="openCard" data-id="${k.c.id}" title="${esc(m.name)}">
          <span class="bar-n">${esc(m.name)}</span>
          <span class="bar-t"><i class="${fcClass(k.fc)}" style="width:${Math.min(100,k.fc/scale*100).toFixed(2)}%"></i></span>
          <span class="bar-v">${num(k.fc,1)}%</span></button>`).join('') || '<div class="empty">Noch keine Gerichte kalkuliert.</div>'}
        <div class="bar-axis"><span></span><span class="ax"><i>0 %</i><i>${num(scale/2)} %</i><i>${num(scale)} %</i></span><span></span></div>
      </div>
    </section>
    <div class="stack">
      <section class="panel">
        <div class="panel-h"><h2>Zu erledigen</h2></div>
        <ul class="todo">
          <li><button type="button" data-act="goStock" data-id="bestellung"><b class="${low.length?'bad-t':''}">${low.length}</b><span>Artikel nachbestellen</span>${ico('arrow','flip')}</button></li>
          ${(() => { const t = todayStr(), w = wd(t); const due = (S.suppliers||[]).filter(sp=>sp.active && sp.orderDays.includes(w) && !lastOrderToday(sp.id)); const exp = (S.orders||[]).filter(o=>['sent','confirmed'].includes(o.status) && o.deliveryDate<=t); return (due.length?`<li><button type="button" data-act="goStock" data-id="bestellung"><b class="${due.some(sp=>hm(sp.cutoff)-nowMin()<90)?'bad-t':''}">${due.length}</b><span>Heute bestellen: ${due.map(x=>esc(x.name)).join(', ')}</span>${ico('arrow','flip')}</button></li>`:'') + (exp.length?`<li><button type="button" data-act="goStock" data-id="bestellung"><b>${ico('truck')}</b><span>${exp.length} ${exp.length===1?'Lieferung':'Lieferungen'} heute prüfen</span>${ico('arrow','flip')}</button></li>`:''); })()}
          ${(() => { const nx = S.specials.filter(sp=>spStatus(sp)[0]!=='past').sort((a,b)=>a.from.localeCompare(b.from))[0]; return nx ? `<li><button type="button" data-act="previewSpecial" data-id="${nx.id}"><b>${ico('star')}</b><span>${esc(nx.name)} · ${spStatus(nx)[1]}</span>${ico('arrow','flip')}</button></li>` : ''; })()}
          <li><button type="button" data-act="goMenu" data-id="noalg"><b class="${S.menu.some(m=>!hasAlg(m))?'bad-t':''}">${S.menu.filter(m=>!hasAlg(m)).length}</b><span>Gerichte ohne Allergenangabe</span>${ico('arrow','flip')}</button></li>
          <li><button type="button" data-act="goMenu" data-id="none"><b>${S.menu.length-linked.length}</b><span>Gerichte ohne Rezeptur</span>${ico('arrow','flip')}</button></li>
          <li><button type="button" data-act="goMenu" data-id="over"><b class="${over.length?'bad-t':''}">${over.length}</b><span>Gerichte über ${num(tg)} % Wareneinsatz</span>${ico('arrow','flip')}</button></li>
          <li><button type="button" data-act="goStock" data-id="inventur"><b>${S.invDraft?'…':ico('clip')}</b><span>${S.invDraft?'Laufende Inventur fortsetzen':'Inventur durchführen'}</span>${ico('arrow','flip')}</button></li>
        </ul>
      </section>
      <section class="panel">
        <div class="panel-h"><h2>Größte Kostentreiber</h2></div>
        <div class="stackbar">${top.map(([id,v],i)=>`<i style="width:${(v/drvSum*100).toFixed(2)}%;background:var(--s${i+1})"></i>`).join('')}<i style="flex:1;background:var(--s7)"></i></div>
        <ul class="leg">${top.map(([id,v],i)=>`<li><span class="sw" style="background:var(--s${i+1})"></span><span class="ln">${esc(P(id)?.name)}</span><span class="mono">${num(v/drvSum*100,1)} %</span></li>`).join('')}
          <li><span class="sw" style="background:var(--s7)"></span><span class="ln muted">Übrige Produkte</span><span class="mono">${num((1-top.reduce((s,x)=>s+x[1],0)/drvSum)*100,1)} %</span></li></ul>
        <p class="hint">Anteil am Wareneinsatz aller kalkulierten Gerichte, je eine Portion.</p>
      </section>
    </div>
  </div>`;
}

/* ---------- Speisekarte ---------- */
function renderMenu(){
  const hidden = S.menu.filter(m=>m.hidden).length;
  const head = `<div class="page-h"><div><div class="eyebrow">${S.menu.length} Gerichte · ${secList().length} Kategorien${hidden?` · ${hidden} ausgeblendet`:''}</div><h1>Speisekarte</h1></div>
    <div class="row-btns">${view.mtab==='guest' && !FRAMED ? `<button type="button" class="btn" data-act="printMenu">${ico('print')}Drucken</button>` : ''}<button type="button" class="btn primary" data-act="newMenu">${ico('plus')}Gericht</button></div></div>
  <div class="toolbar">${seg('mtab', view.mtab, [['calc','Kalkulation'],['guest','Gästekarte'],['layout','Aufbau & Reihenfolge']])}</div>`;
  return head + (view.mtab==='guest' ? renderGuest() : view.mtab==='layout' ? renderLayout() : renderMenuCalc());
}

function renderMenuCalc(){
  const q = view.q.trim().toLowerCase();
  const all = menuSorted().map(m => ({m, k:menuCalc(m)}));
  const f = view.sec;
  const shown = all.filter(({m,k}) => (!q || (m.name+' '+m.desc+' '+m.section+' '+(k.t?k.t.lines.map(l=>l.name).join(' '):'')).toLowerCase().includes(q))
    && (f==='all' || (f==='none' ? k.cost==null : f==='over' ? (k.fc!=null && k.fc > S.settings.target) : f==='nophoto' ? !menuImg(m) : f==='noalg' ? !hasAlg(m) : SEASONS.some(x=>x[0]===f) ? m.seasons.includes(f) : m.section===f)));
  const cnt = x => all.filter(x).length;
  const chip = (k,l,n,dot) => `<button type="button" class="chip ${f===k?'on':''}" data-act="sec" data-id="${esc(k)}">${dot||''}${esc(l)}<small>${n}</small></button>`;
  let h = `<div class="toolbar"><label class="search">${ico('search')}<input id="mq" type="search" placeholder="Gericht, Zutat oder Kategorie" value="${esc(view.q)}" autocomplete="off"></label></div>
  <div class="chips-row">${chip('all','Alle',all.length)}${chip('over','Über Ziel',cnt(x=>x.k.fc!=null&&x.k.fc>S.settings.target))}${chip('none','Ohne Rezeptur',cnt(x=>x.k.cost==null))}${chip('nophoto','Ohne Foto',cnt(x=>!menuImg(x.m)))}${chip('noalg','Ohne Allergene',cnt(x=>!hasAlg(x.m)))}<span class="sep"></span>${SEASONS.map(([k,l])=>chip(k,'Nur '+l,cnt(x=>x.m.seasons.includes(k)))).join('')}<span class="sep"></span>${secList().filter(s=>all.some(x=>x.m.section===s)).map(s=>chip(s,s,cnt(x=>x.m.section===s),catDot(s))).join('')}</div>`;
  if(!shown.length) return h + `<div class="panel empty">Keine Gerichte für diesen Filter.</div>`;
  for(const s of secList().filter(s=>shown.some(x=>x.m.section===s))){
    h += `<h2 class="sec-h">${catDot(s)}${esc(s)}</h2><div class="dish-grid">`;
    for(const {m,k} of shown.filter(x=>x.m.section===s)){
      h += `<article class="dish ${k.c?'':'nocard'} ${m.hidden?'is-hidden':''}">
        <div class="dish-ph">${photo(menuImg(m), m.name, m.section)}
          <button type="button" class="ph-btn" data-act="photoMenu" data-id="${m.id}" title="Foto ${menuImg(m)?'ändern':'hinzufügen'}" aria-label="Foto ${menuImg(m)?'ändern':'hinzufügen'}">${ico('camera')}</button>
          <span class="ph-flags">${m.top?'<span class="vb top" title="Empfehlung">★</span>':''}${vegBadge(m.veg)}${m.hidden?'<span class="vb off">ausgeblendet</span>':''}${m.seasons.length?`<span class="vb off">${m.seasons.map(seasonName).join(' · ')}</span>`:''}${m.days.length?`<span class="vb off">${esc(daysLabel(m))}</span>`:''}</span></div>
        <button type="button" class="dish-main" data-act="${k.c?'openCard':'newCardFor'}" data-id="${k.c?k.c.id:m.id}">
          <span class="dish-top"><span class="dish-n">${esc(m.name)}</span><span class="price">${eur(m.price)}</span></span>
          ${m.desc?`<span class="dish-d">${esc(m.desc)}</span>`:''}
          <span class="dish-b">${k.c ? `<span class="fcw">${ring(k.fc,34,4)}<span><b class="mono">${pct(k.fc)}</b><small>WE ${eur(k.cost)}</small></span></span>${chips(k.t.alg)}`
            : `<span class="add">${ico('plus')}Rezeptur anlegen</span>${hasAlg(m) ? chips(new Set(algList(m.alg))) : '<span class="vb warn">Allergene fehlen</span>'}`}</span>
        </button>
        <button type="button" class="icon-btn edit" title="Gericht bearbeiten" aria-label="Gericht bearbeiten" data-act="editMenu" data-id="${m.id}">${ico('edit')}</button>
      </article>`;
    }
    h += `</div>`;
  }
  return h;
}

function guestHtml(){
  const g = S.settings.guest;
  const items = menuSorted().filter(m => !m.hidden);
  const used = new Set();
  let body = '';
  for(const s of secList()){
    const list = items.filter(m=>m.section===s); if(!list.length) continue;
    body += `<section class="g-sec"><h3 class="g-h"><span>${esc(s)}</span></h3><div class="g-list">`;
    for(const m of list){
      const k = menuCalc(m); const alg = k.t ? [...k.t.alg].sort() : []; alg.forEach(a=>used.add(a));
      const img = g.photos ? menuImg(m) : '';
      body += `<article class="g-item ${img?'has-ph':''} ${m.top?'is-top':''}">
        ${img ? `<img class="g-ph" src="${IMG[img]}" alt="${esc(m.name)}" loading="lazy">` : ''}
        <div class="g-txt"><div class="g-row"><span class="g-n">${esc(m.name)}${m.veg==='vg'?' <i class="g-mark" title="Vegan">VG</i>':m.veg==='v'?' <i class="g-mark" title="Vegetarisch">V</i>':''}</span><span class="lead"></span><span class="g-p">${fin(+m.price).toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>
        ${m.top?`<div class="g-top">★ Empfehlung des Hauses</div>`:''}
        ${g.desc && m.desc ? `<div class="g-d">${esc(m.desc)}</div>` : ''}
        ${g.allergens && alg.length ? `<div class="g-a">${alg.join(' · ')}</div>` : ''}</div>
      </article>`;
    }
    body += `</div></section>`;
  }
  const legend = g.allergens && used.size ? `<div class="g-leg">${[...used].sort().map(a=>`<span><b>${a}</b> ${esc(ALG[a])}</span>`).join('')}</div>` : '';
  return `<div class="g-paper g-${g.style}">
    <header class="g-head"><div class="g-mark-logo">DAHUAM<span>.</span>202</div><h2 class="g-title">${esc(g.title)}</h2>${g.subtitle?`<div class="g-sub">${esc(g.subtitle)}</div>`:''}</header>
    ${body || '<p class="g-empty">Noch keine sichtbaren Gerichte.</p>'}
    <footer class="g-foot"><div class="g-keys"><span><i class="g-mark">V</i> vegetarisch</span><span><i class="g-mark">VG</i> vegan</span><span>★ Empfehlung des Hauses</span></div>${legend}<p>${esc(g.footer)}</p></footer>
  </div>`;
}

  return `<div class="guest-wrap">
    <aside class="panel guest-tools">
      <div class="panel-h"><h2>Gestaltung</h2></div>

}

  return `<div class="layout-intro"><p class="hint" style="margin:0">So ist Ihre Karte aufgebaut. Neue Gerichte landen automatisch in der passenden Kategorie, am Ende der Liste. Mit den Pfeilen ändern Sie die Reihenfolge, mit dem Auge blenden Sie ein Gericht auf der Gästekarte aus.</p>
    <button type="button" class="btn" data-act="addSec">${ico('plus')}Kategorie</button></div>
  <div class="lay">${secs.map((s,si)=>{ const items = menuSorted().filter(m=>m.section===s); return `<section class="panel lay-sec">
    <div class="lay-h"><span class="lay-no mono">${si+1}</span>${catDot(s)}<input class="lay-name" data-secname="${si}" value="${esc(s)}" aria-label="Kategoriename"><span class="muted sm">${items.length}</span>
      <span class="lay-acts"><button type="button" class="icon-btn" data-act="secMove" data-id="${si}:-1" ${si===0?'disabled':''} aria-label="Kategorie nach oben">${ico('up')}</button><button type="button" class="icon-btn" data-act="secMove" data-id="${si}:1" ${si===secs.length-1?'disabled':''} aria-label="Kategorie nach unten">${ico('down')}</button>
      <button type="button" class="icon-btn" data-act="secSort" data-id="${si}" title="Nach Preis sortieren" aria-label="Nach Preis sortieren"><span class="mono" style="font-size:12px">€↑</span></button>
      ${items.length?'':`<button type="button" class="icon-btn danger" data-act="secDel" data-id="${si}" aria-label="Kategorie löschen">${ico('trash')}</button>`}</span></div>
    ${items.length ? `<ol class="lay-list">${items.map((m,i)=>`<li class="${m.hidden?'off':''}">${photo(menuImg(m), m.name, s, 'xs')}<span class="lay-n" title="${esc(m.name)}">${esc(m.name)}</span><span class="mono sm">${eur(m.price)}</span>
      <button type="button" class="icon-btn" data-act="itemMove" data-id="${m.id}:-1" ${i===0?'disabled':''} aria-label="Nach oben">${ico('up')}</button><button type="button" class="icon-btn" data-act="itemMove" data-id="${m.id}:1" ${i===items.length-1?'disabled':''} aria-label="Nach unten">${ico('down')}</button>
      <button type="button" class="icon-btn" data-act="itemHide" data-id="${m.id}" title="${m.hidden?'Auf der Gästekarte zeigen':'Auf der Gästekarte ausblenden'}" aria-label="Sichtbarkeit">${ico(m.hidden?'eyeoff':'eye')}</button></li>`).join('')}</ol>` : '<p class="hint">Leer. Ein Gericht mit dieser Kategorie erscheint hier automatisch.</p>'}
  </section>`; }).join('')}</div>`;
}

/* ---------- Rezepturen ---------- */
function renderCards(){
  const q = view.q.trim().toLowerCase();
  const list = S.cards.filter(c => (view.ctype==='all' || c.type===view.ctype) && (!q || (c.name+' '+c.category).toLowerCase().includes(q)))
    .sort((a,b) => a.type===b.type ? byName(a,b) : (a.type==='semi'?1:-1));
  const n = t => S.cards.filter(c=>t==='all'||c.type===t).length;
  let h = `<div class="page-h"><div><div class="eyebrow">${n('dish')} Gerichte · ${n('semi')} Basisrezepte</div><h1>Rezepturen</h1></div>
    <div class="row-btns"><button type="button" class="btn" data-act="newCard" data-id="semi">${ico('plus')}Basisrezept</button><button type="button" class="btn primary" data-act="newCard" data-id="dish">${ico('plus')}Gericht</button></div></div>
  <div class="toolbar"><label class="search">${ico('search')}<input id="cq" type="search" placeholder="Rezeptur suchen" value="${esc(view.q)}" autocomplete="off"></label>
    ${seg('ctype', view.ctype, [['all','Alle',n('all')],['dish','Gerichte',n('dish')],['semi','Basisrezepte',n('semi')]])}</div>`;
  if(!list.length) return h + `<div class="panel empty">Keine Rezepturen gefunden. Legen Sie eine mit „Gericht“ an.</div>`;
  h += `<div class="rc-grid">`;
  for(const c of list){
    const t = totals(c);
    const per100 = c.yieldG ? t.cost / c.yieldG * 100 : 0;
    const mk = S.menu.filter(m => m.card === c.id).map(menuCalc)[0];
    h += `<button type="button" class="rc" data-act="openCard" data-id="${c.id}">
      <span class="rc-ph">${photo(c.img, c.name, c.category)}${c.type==='dish' && !mk ? '<span class="vb off">nicht auf der Karte</span>' : ''}</span>
      <span class="rc-body">
      <span class="rc-top"><span class="tag ${c.type}">${c.type==='semi'?'Basisrezept':'Gericht'} · Nr. ${c.no||'—'}</span>${c.type==='dish'?`<span class="fcw sm">${ring(mk?mk.fc:null,28,4)}<b class="mono">${mk?pct(mk.fc):'—'}</b></span>`:''}</span>

      </span>
    </button>`;
  }
  return h + `</div>`;
}

function refOptions(sel, selfId){
  const ps = [...S.products].sort(byName);

}
function simHtml(cost, price){

}
function prodHtml(c, n){
  const t = totals(c), f = c.type==='semi' && c.yieldG ? 1 : n;
  const rows = c.items.map((it,i)=>{ const l = t.lines[i]; if(l.missing) return ''; const q = (+it.qty||0)*f; const v = l.unit==='Stk' ? (Math.abs(q - Math.round(q)) < 1e-6 ? num(q)+' Stk' : `${num(Math.ceil(q - 1e-9))} Stk <small class="muted exact">genau ${num(q,2)}</small>`) : q>=1000 ? num(q/1000,2)+(l.unit==='ml'?' l':' kg') : num(q)+' '+l.unit; return `<li><span>${esc(l.name)}</span><b class="mono">${v}</b></li>`; }).join('');

}

    <div class="row-btns"><button type="button" class="btn" data-act="sales">${ico('cart')}Verkäufe buchen</button><button type="button" class="btn" data-act="moveDlg" data-id="waste">${ico('trash')}Schwund</button><button type="button" class="btn primary" data-act="moveDlg" data-id="in">${ico('truck')}Wareneingang</button></div></div>

  <div class="tiles">

    <button type="button" class="tile click" data-act="stab" data-id="inventur"><div><div class="t-v ${last&&last.diff<0?'bad-t':''}">${last?eur(last.diff):'—'}</div><div class="t-l">Differenz letzte Inventur</div><div class="t-s">${S.invDraft?'Inventur läuft →':last?fmtDate(last.date):'Noch keine Inventur'}</div></div></button>

function levelBar(p){ const s = +p.stock||0, mn = +p.minStock||0; const w = mn ? Math.min(100, s/(mn*2)*100) : 100; const cls = mn && s < mn*0.5 ? 'bad' : mn && s < mn ? 'warn' : 'good'; return `<span class="lvl"><i class="${cls}" style="width:${w.toFixed(1)}%"></i>${mn?`<em style="left:50%"></em>`:''}</span>`; }
function stockList(){
  const q = view.pq.trim().toLowerCase();

}
function movesByDate(){ return S.moves.map((m,i)=>[m,i]).sort((a,b) => String(b[0].date).localeCompare(String(a[0].date)) || a[1]-b[1]).map(x=>x[0]); }
function moveList(){
  const t = view.mtype;
  const all = movesByDate().filter(m => t==='all' || m.type===t);
  const chip = (k,l) => `<button type="button" class="chip ${t===k?'on':''}" data-act="mtype" data-id="${k}">${l}<small>${k==='all'?S.moves.length:S.moves.filter(m=>m.type===k).length}</small></button>`;
  const undo = (id, lbl) => `<button type="button" class="icon-btn" data-act="moveUndo" data-id="${id}" title="Stornieren" aria-label="${lbl}">${ico('undo')}</button>`;
  const seen = new Set(); const out = [];
  for(const m of all){
    if(out.length >= 300) break;
    if(m.grp){ if(seen.has(m.grp)) continue; seen.add(m.grp);
      const ms = all.filter(x => x.grp === m.grp); const g = (S.saleGroups||{})[m.grp] || {}; const val = ms.reduce((a,x)=>a+x.qty*x.price,0);
      out.push(`<li class="mv-grp"><span class="mv-d mono">${fmtDate(m.date)}</span><span class="mvt ${m.type}">${MOVE[m.type]}</span>
        <span class="mv-n"><b>${g.n ? `${num(g.n)} ${g.n===1?'Portion':'Portionen'}` : esc(m.note||'Sammelbuchung')}</b><details class="mv-det"><summary>${ms.length} Artikel abgebucht${g.gross ? ` · Umsatz ${eur(g.gross)}` : ''}</summary><ul>${ms.map(x=>{ const p = P(x.pid); return `<li><span>${esc(p?p.name:'gelöschter Artikel')}</span><span class="mono">${qtyFmt(x.qty,p)}</span></li>`; }).join('')}</ul></details></span>
        <span class="mv-q mono muted">${ms.length} Pos.</span><span class="mv-v mono">${eur(val)}</span>${undo(m.id, 'Verkaufsbuchung stornieren')}</li>`); continue; }
    const p = P(m.pid);
    out.push(`<li><span class="mv-d mono">${fmtDate(m.date)}</span><span class="mvt ${m.type}">${MOVE[m.type]}</span>
    <span class="mv-n"><b>${esc(p?p.name:'gelöschter Artikel')}</b>${m.note?`<small class="muted">${esc(m.note)}</small>`:''}</span>
    <span class="mv-q mono ${m.qty<0?'bad-t':'good-t'}">${m.qty>0?'+':''}${qtyFmt(m.qty,p)}</span>

/* ---------- Dialoge ---------- */
function openDialog(title, body, onOk, opts={}){
  const f = $('#dlgForm'), d = $('#dlg');
  f.oninput = null; f.onclick = null; delete f.dataset.force;
  f.innerHTML = `<div class="dlg-h"><h3>${esc(title)}</h3><button type="button" class="icon-btn" id="dlgX" aria-label="Schließen">${ico('x')}</button></div>${body}<div class="dlg-actions">${opts.del?'<button type="button" class="btn danger" id="dlgDel">Löschen</button>':''}<span class="sp"></span><button type="button" class="btn" id="dlgCancel">${opts.cancel||'Abbrechen'}</button>${onOk?`<button type="submit" class="btn primary">${opts.ok||'Speichern'}</button>`:''}</div>`;
  f.onsubmit = e => { e.preventDefault();
    // Zahlenfelder: Komma oder Punkt, nie negativ; erst prüfen, dann für den Handler normalisieren
    const nums = [...f.querySelectorAll('input.num-in')]; const shown = nums.map(i => i.value); let bad = null;
    f.querySelectorAll('.f-err').forEach(n => n.remove());
    nums.forEach(i => { i.classList.remove('bad-in'); const raw = i.value.trim(); if(raw === '') return; const v = numParse(raw); const min = i.dataset.min != null ? +i.dataset.min : 0, max = i.dataset.max != null ? +i.dataset.max : Infinity; if(!isFinite(v) || v < min || v > max){ i.classList.add('bad-in'); bad = bad || i; } });
    if(bad){ dlgErr(bad, bad.dataset.msg || 'Bitte eine gültige Zahl eingeben, zum Beispiel 12,5. Negative Werte sind nicht möglich.'); return; }
    nums.forEach(i => { if(i.value.trim() !== '') i.value = String(numParse(i.value)); });
    let r; try { r = onOk ? onOk(new FormData(f), f) : undefined; } finally { nums.forEach((i,k) => { if(i.isConnected) i.value = shown[k]; }); }
    if(r === false) return;
    d.close(); save(); render(); if(opts.toast!==false) toast(typeof opts.done==='function' ? opts.done() : (opts.done||'Gespeichert')); };
  $('#dlgCancel').onclick = $('#dlgX').onclick = () => d.close();
  if(opts.del) $('#dlgDel').onclick = () => { d.close(); opts.del(); };
  d.showModal();
  opts.after && opts.after(f);
}
/* Hinweis direkt am Feld; Dialog bleibt offen */
function dlgErr(input, msg){
  const f = $('#dlgForm'); if(typeof input === 'string') input = f.elements[input] || f.querySelector(input);
  f.querySelectorAll('.f-err').forEach(n => n.remove());
  const el = document.createElement('small'); el.className = 'f-err'; el.setAttribute('role','alert'); el.textContent = msg;
  if(input && input.insertAdjacentElement){ input.classList.add('bad-in'); (input.closest('.qty') || input).insertAdjacentElement('afterend', el); input.focus(); const off = () => { input.classList.remove('bad-in'); input.removeEventListener('input', off); }; input.addEventListener('input', off); }
  else f.querySelector('.dlg-actions').insertAdjacentElement('beforebegin', el);
  return false;
}
/* Klick neben den Dialog schließt ihn (nicht, wenn eine Textmarkierung hinausgezogen wird) */
(() => { const d = $('#dlg'); if(!d) return; let down = false;
  const outside = e => { const r = d.getBoundingClientRect(); return e.target === d && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom); };
  d.addEventListener('pointerdown', e => { down = outside(e); });
  d.addEventListener('click', e => { if(down && outside(e)) d.close(); down = false; }); })();

const DEMO_SALES_OPT = ['Demo-Verkäufe löschen (empfohlen)', 'Demo-Verkäufe behalten'];
function demoSalesDays(){ const real = S.salesReal || {}; return Object.keys(S.salesDays||{}).filter(d => !real[d]); }
