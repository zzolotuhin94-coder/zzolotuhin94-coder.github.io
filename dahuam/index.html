/* ---------- helpers ---------- */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fin = n => (typeof n === 'number' && isFinite(n)) ? n : 0;
const eur = n => fin(n).toLocaleString('de-AT',{style:'currency',currency:'EUR'});
const num = (n,d=0) => fin(n).toLocaleString('ru-RU',{maximumFractionDigits:d});
const pct = n => (n==null || !isFinite(n)) ? '—' : num(n,1)+' %';

let S = load() || seed();
let view = {tab:'menu', card:null, q:'', ctype:'all', pq:''};

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function load(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }

const P = id => S.products.find(p => p.id === id);
const C = id => S.cards.find(c => c.id === id);
function refObj(ref){ if(!ref) return null; const i = ref.indexOf(':'); const t = ref.slice(0,i), id = ref.slice(i+1); const o = t==='p' ? P(id) : C(id); return o ? {t,o} : null; }
const algList = s => String(s||'').split(/[\s,]+/).filter(Boolean);

/* ---------- calculation ---------- */
function line(it, depth){
  const res = {name:'выберите ингредиент', unit:'г', grossG:0, net:0, out:0, cost:0, alg:new Set(), missing:true, netAuto:0};
  const r = refObj(it.ref); if(!r) return res;
  res.missing = false;
  const q = +it.qty || 0;
  if(r.t === 'p'){
    const p = r.o; res.name = p.name;
    if(p.unit === 'шт'){ res.unit = 'шт'; res.cost = q * fin(+p.price); res.grossG = q * fin(+p.pieceG); }
    else { res.unit = p.unit === 'л' ? 'мл' : 'г'; res.cost = q/1000 * fin(+p.price); res.grossG = q; }
    res.netAuto = res.grossG * (1 - fin(+p.lossCold)/100);
    res.net = it.net !== '' && it.net != null ? +it.net : res.netAuto;
    res.out = res.net * (1 - fin(+p.lossHot)/100);
    algList(p.alg).forEach(a => res.alg.add(a));
  } else {
    const c = r.o; res.name = 'ПФ · ' + c.name; res.grossG = q;
    const t = totals(c, depth+1);
    res.cost = c.yieldG ? q * t.cost / c.yieldG : 0;
    res.netAuto = q; res.net = it.net !== '' && it.net != null ? +it.net : q; res.out = res.net;
    t.alg.forEach(a => res.alg.add(a));
  }
  return res;
}
function totals(c, depth=0){
  const t = {cost:0, gross:0, net:0, out:0, alg:new Set(), lines:[]};
  if(!c || depth > 6) return t;
  for(const it of c.items){ const l = line(it, depth); t.lines.push(l); t.cost += l.cost; t.gross += l.grossG; t.net += l.net; t.out += l.out; l.alg.forEach(a => t.alg.add(a)); }
  return t;
}
function menuCalc(m){
  const c = m.card ? C(m.card) : null;
  const t = c ? totals(c) : null;
  const netPrice = (+m.price||0) / (1 + S.settings.vat/100);
  const cost = t ? t.cost : null;
  return {c, t, cost, netPrice, fc: cost!=null && netPrice ? cost/netPrice*100 : null, margin: cost!=null ? netPrice - cost : null};
}
function fcClass(fc){ if(fc==null) return 'na'; const tg = +S.settings.target; return fc <= tg ? 'good' : fc <= tg+7 ? 'warn' : 'bad'; }
function fcBadge(fc){ return `<span class="fc ${fcClass(fc)}">${fc==null ? 'нет ТК' : pct(fc)}</span>`; }
function chips(set){ const a = [...set].sort(); return a.length ? `<div class="chips">${a.map(x=>`<span class="alg" title="${esc(ALG[x]||x)}">${esc(x)}</span>`).join('')}</div>` : ''; }
function usage(ref){ return S.cards.filter(c => c.items.some(i => i.ref === ref)); }

  if(view.tab === 'menu') app.innerHTML = renderMenu();
  else if(view.tab === 'cards') app.innerHTML = view.card && C(view.card) ? renderCard(C(view.card)) : renderCards();

}

  if(!list.length) h += `<div class="empty">Техкарт пока нет. Создайте первую кнопкой «+ Блюдо».</div>`;
  for(const c of list){
    const t = totals(c);
    const per100 = c.yieldG ? t.cost / c.yieldG * 100 : 0;
    const menus = S.menu.filter(m => m.card === c.id).map(menuCalc);
    h += `<div class="row click" data-act="openCard" data-id="${c.id}">
      <div><div class="nm">${esc(c.name)}</div><div class="ds"><span class="tag ${c.type==='semi'?'semi':''}">${c.type==='semi'?'заготовка':'блюдо'}</span> ТТК № ${c.no||'—'} · ${esc(c.category||'без раздела')} · выход ${num(c.yieldG)} г · ${c.items.length} ингр.</div>${chips(t.alg)}</div>

      <div class="acts">${c.type==='dish' ? fcBadge(menus.length ? menus[0].fc : null) : ''}</div>
    </div>`;
  }
  return h + `</div>`;
}

function refOptions(sel, selfId){
  const ps = [...S.products].sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  const cs = S.cards.filter(c => c.type==='semi' && c.id!==selfId).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  return `<option value="">— выберите —</option><optgroup label="Продукты">${ps.map(p=>`<option value="p:${p.id}" ${sel==='p:'+p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`
    + (cs.length ? `<optgroup label="Заготовки (ПФ)">${cs.map(c=>`<option value="c:${c.id}" ${sel==='c:'+c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>` : '');

function renderCard(c){
  const t = totals(c);
  const per100 = c.yieldG ? t.cost / c.yieldG * 100 : 0;
  const menus = S.menu.filter(m => m.card === c.id);
  const cats = [...new Set([...S.menu.map(m=>m.section), ...S.cards.map(x=>x.category)].filter(Boolean))];
  const usedIn = usage('c:'+c.id);
  const vat = 1 + S.settings.vat/100;
  const rec = t.cost / (S.settings.target/100) * vat;
  let rows = c.items.map((it,i) => {
    const l = t.lines[i];
    return `<tr>
      <td><select id="ref-${i}" data-li="${i}" data-lf="ref" aria-label="Ингредиент">${refOptions(it.ref, c.id)}</select></td>

      <td class="r"><input id="net-${i}" type="number" step="any" min="0" data-li="${i}" data-lf="net" value="${esc(it.net)}" placeholder="${num(l.netAuto,1)}" aria-label="Нетто, г"></td>

  <div class="bar" style="margin-top:0"><h1 style="flex:1 1 300px">${esc(c.name)}</h1>

    <button type="button" class="btn danger" data-act="delCard" data-id="${c.id}">Удалить</button></div>
  <div class="grid2">
    <div style="min-width:0">
      <div class="panel"><div class="fields">
        <label class="f">Название<input id="cf-name" data-cf="name" value="${esc(c.name)}"></label>
        <label class="f">Тип<select id="cf-type" data-cf="type"><option value="dish" ${c.type==='dish'?'selected':''}>Блюдо</option><option value="semi" ${c.type==='semi'?'selected':''}>Заготовка (ПФ)</option></select></label>
        <label class="f">Раздел<input id="cf-category" data-cf="category" list="cats" value="${esc(c.category)}"><datalist id="cats">${cats.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
        <label class="f">${c.type==='semi'?'Выход партии, г':'Выход порции, г'}<input id="cf-yieldG" data-cf="yieldG" type="number" step="any" min="0" value="${esc(c.yieldG)}" placeholder="${num(t.out)}"></label>
      </div></div>
      <h2>Закладка ${c.type==='semi'?'на партию':'на 1 порцию'}</h2>
      <div class="tbl-wrap"><table class="edit">
        <thead><tr><th>Ингредиент</th><th class="r">Брутто</th><th></th><th class="r">Нетто, г</th><th class="r">Выход, г</th><th class="r">Сумма</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7" class="muted">Добавьте первый ингредиент.</td></tr>`}</tbody>
        <tfoot><tr><td>Итого</td><td class="r num">${num(t.gross)}</td><td></td><td class="r num">${num(t.net)}</td><td class="r num">${num(t.out)}</td><td class="r num">${eur(t.cost)}</td><td></td></tr></tfoot>

    </div>

      <div class="panel">
        <div class="muted" style="font-size:13px">Себестоимость ${c.type==='semi'?'партии':'порции'}</div>

    </div>

/* ---------- dialogs ---------- */
function openDialog(title, body, onOk, opts={}){
  const f = $('#dlgForm'), d = $('#dlg');
  f.innerHTML = `<h3>${esc(title)}</h3>${body}<div class="dlg-actions">${opts.del?'<button type="button" class="btn danger" id="dlgDel">Удалить</button>':''}<span class="sp"></span><button type="button" class="btn" id="dlgCancel">${opts.cancel||'Отмена'}</button>${onOk?`<button type="submit" class="btn primary">${opts.ok||'Сохранить'}</button>`:''}</div>`;
  f.onsubmit = e => { e.preventDefault(); if(onOk){ const r = onOk(new FormData(f)); if(r === false) return; } d.close(); save(); render(); };
  $('#dlgCancel').onclick = () => d.close();
  if(opts.del) $('#dlgDel').onclick = () => { d.close(); opts.del(); };
  d.showModal();
}
function ask(text, yes, ok='Удалить'){ openDialog('Подтвердите', `<p style="margin:0">${esc(text)}</p>`, () => { yes(); }, {ok}); }
function info(title, text){ openDialog(title, `<p style="margin:0">${esc(text)}</p>`, null, {cancel:'Понятно'}); }

function menuDialog(m){
  const isNew = !m; m = m || {id:uid('m'), section:'', name:'', desc:'', price:'', card:''};
  const secs = [...new Set(S.menu.map(x=>x.section))];
  const opts = S.cards.filter(c=>c.type==='dish').sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  openDialog(isNew ? 'Новая позиция меню' : 'Позиция меню', `
    <label class="f">Раздел<input name="section" list="secs" required value="${esc(m.section)}"><datalist id="secs">${secs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></label>
    <label class="f">Название<input name="name" required value="${esc(m.name)}"></label>
    <label class="f">Описание<input name="desc" value="${esc(m.desc)}"></label>
    <label class="f">Цена с НДС, €<input name="price" type="number" step="0.01" min="0" required value="${esc(m.price)}"></label>
    <label class="f">Техкарта<select name="card"><option value="">— не привязана —</option>${opts.map(c=>`<option value="${c.id}" ${m.card===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`,
    fd => { Object.assign(m, {section:fd.get('section').trim(), name:fd.get('name').trim(), desc:fd.get('desc').trim(), price:+fd.get('price'), card:fd.get('card')}); if(isNew) S.menu.push(m); },
    {del: isNew ? null : () => ask(`Удалить «${m.name}» из меню? Техкарта останется.`, () => { S.menu = S.menu.filter(x=>x!==m); })});

    <label class="f">Название<input name="name" required value="${esc(p.name)}"></label>

      <label class="f">Единица<select name="unit">${['кг','л','шт'].map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></label>
      <label class="f">Цена за ед., € без НДС<input name="price" type="number" step="0.01" min="0" required value="${esc(p.price)}"></label>
      <label class="f">Вес 1 шт, г (для «шт»)<input name="pieceG" type="number" step="any" min="0" value="${esc(p.pieceG)}"></label>
      <label class="f">Отход при холодной обработке, %<input name="lossCold" type="number" step="any" min="0" max="100" value="${esc(p.lossCold)}"></label>
      <label class="f">Потери при тепловой обработке, %<input name="lossHot" type="number" step="any" min="0" max="100" value="${esc(p.lossHot)}"></label>

    fd => { Object.assign(p, {name:fd.get('name').trim(), unit:fd.get('unit'), price:+fd.get('price'), pieceG:fd.get('pieceG'), lossCold:+fd.get('lossCold')||0, lossHot:+fd.get('lossHot')||0, alg:fd.getAll('alg').join(' ')}); if(isNew) S.products.push(p); },
    {del: isNew ? null : () => { const u = usage('p:'+p.id); if(u.length) return info('Продукт используется', `Он есть в техкартах: ${u.map(c=>c.name).join(', ')}. Сначала уберите его оттуда.`); ask(`Удалить продукт «${p.name}»?`, () => { S.products = S.products.filter(x=>x!==p); }); }});
}

function newCard(type, fromMenu){
  const c = {id:uid(type==='semi'?'semi':'dish'), no:S.settings.nextNo++, name: fromMenu ? fromMenu.name : (type==='semi'?'Новая заготовка':'Новое блюдо'), type, category: fromMenu ? fromMenu.section : (type==='semi'?'Заготовки':''), yieldG:'', method:'', items:[{ref:'',qty:'',net:''}]};
  S.cards.push(c); if(fromMenu) fromMenu.card = c.id;
  view = {...view, tab:'cards', card:c.id}; save(); render(); scrollTo(0,0);
}

function exportData(){
  const json = JSON.stringify(S, null, 1);
  openDialog('Резервная копия', `<p class="hint" style="margin:0">Скопируйте текст и сохраните его в файл с расширением .json. Восстановить данные можно в «Настройках» кнопкой «Загрузить копию».</p>
    <textarea id="expTxt" readonly style="min-height:200px;font:12px var(--f-mono)">${esc(json)}</textarea>
    <div class="bar" style="margin:0"><button type="button" class="btn" id="copyBtn">Скопировать</button>${FRAMED?'':'<button type="button" class="btn" id="dlBtn">Скачать файл</button>'}<span class="hint" id="copyMsg" style="margin:0"></span></div>`, null, {cancel:'Закрыть'});
  $('#copyBtn').onclick = () => { const ta = $('#expTxt'); const done = () => $('#copyMsg').textContent = 'Скопировано'; navigator.clipboard?.writeText(json).then(done, () => { ta.select(); $('#copyMsg').textContent = 'Текст выделен, нажмите Ctrl+C'; }) ?? (ta.select()); };
  if(!FRAMED) $('#dlBtn').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download = 'dahuam202-kuchnya-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('#tabs button');
  if(tab){ view = {...view, tab:tab.dataset.tab, card:null, q:''}; location.hash = tab.dataset.tab; render(); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const id = el.dataset.id, act = el.dataset.act;
  const c = view.card ? C(view.card) : null;
  switch(act){
    case 'newMenu': menuDialog(); break;
    case 'editMenu': menuDialog(S.menu.find(m=>m.id===id)); break;
    case 'openCard': view = {...view, tab:'cards', card:id}; location.hash = 'cards'; render(); scrollTo(0,0); break;
    case 'backCards': view.card = null; render(); break;
    case 'newCardFor': newCard('dish', S.menu.find(m=>m.id===id)); break;
    case 'newCard': newCard(id); break;
    case 'ctype': view.ctype = id; render(); break;
    case 'addLine': c.items.push({ref:'',qty:'',net:''}); save(); render(); break;
    case 'delLine': c.items.splice(+id,1); save(); render(); break;
    case 'dupCard': { const src = C(id); const cp = JSON.parse(JSON.stringify(src)); cp.id = uid(src.type); cp.no = S.settings.nextNo++; cp.name += ' (копия)'; S.cards.push(cp); view.card = cp.id; save(); render(); break; }
    case 'delCard': { const src = C(id); const u = usage('c:'+id); if(u.length){ info('Заготовка используется', `Она входит в техкарты: ${u.map(x=>x.name).join(', ')}. Сначала уберите её оттуда.`); break; }
      ask(`Удалить техкарту «${src.name}»? Позиции меню останутся без техкарты.`, () => { S.cards = S.cards.filter(x=>x.id!==id); S.menu.forEach(m=>{ if(m.card===id) m.card=''; }); view.card = null; }); break; }
    case 'printCard': printCard(id); break;
    case 'newProd': prodDialog(); break;
    case 'editProd': prodDialog(P(id)); break;
    case 'export': exportData(); break;
    case 'reset': ask('Заменить все данные демо-данными? Ваши изменения пропадут.', () => { S = seed(); }, 'Заменить'); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'mq' || t.id === 'cq'){ view.q = t.value; const pos = t.selectionStart; render(); const n = $('#'+t.id); n.focus(); n.setSelectionRange(pos,pos); }
  if(t.id === 'pq'){ view.pq = t.value; const pos = t.selectionStart; render(); const n = $('#pq'); n.focus(); n.setSelectionRange(pos,pos); }
});

document.addEventListener('change', e => {
  const t = e.target, c = view.card ? C(view.card) : null;
  if(t.dataset.cf && c){ const f = t.dataset.cf; c[f] = f==='yieldG' ? (t.value===''?'':+t.value) : t.value; S.demo = S.demo; save(); if(f!=='method') render(); return; }
  if(t.dataset.li != null && c){ const it = c.items[+t.dataset.li]; const f = t.dataset.lf; it[f] = f==='ref' ? t.value : (t.value===''?'':+t.value); if(f==='ref') it.net = ''; save(); render(); const n = document.getElementById(t.id); n && n.focus(); return; }
  if(t.dataset.pp){ const p = P(t.dataset.pp); p[t.dataset.pf] = +t.value || 0; save(); render(); return; }
  if(t.dataset.sf){ const f = t.dataset.sf; S.settings[f] = f==='name' ? t.value : (+t.value || 0); save(); return; }
  if(t.id === 'importFile' && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if(!d.products || !d.cards || !d.menu) throw 0; S = d; save(); view = {tab:'menu',card:null,q:'',ctype:'all',pq:''}; render(); info('Готово', 'Данные загружены.'); } catch(err){ info('Не удалось загрузить', 'Файл не похож на резервную копию этого приложения. Выберите .json, сохранённый кнопкой «Резервная копия».'); } };
    r.readAsText(t.files[0]); t.value = '';
  }
});

function fromHash(){ const h = location.hash.slice(1); if(['menu','cards','products','setup'].includes(h) && h !== view.tab){ view = {...view, tab:h, card:null, q:''}; render(); } }
window.addEventListener('hashchange', fromHash);
fromHash(); render();
</script>
</body>
</html>
